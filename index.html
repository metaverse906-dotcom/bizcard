<!doctype html>

<head>

<title>隨身名片夾</title>
<meta name="description" content="自己用的數位名片與名片夾：QR code 交換名片，收到的名片疊成一盒，資料只存在你的手機裡。">
<meta name="theme-color" content="#E3EBE6" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 版本號只在這裡設定一次（語意化版本：主版本.次版本.修正號）。
     程式檔網址、離線快取（sw.js）、「關於」裡的版本與更新紀錄都跟著它，改版時只改這一行。
     字體：每個分開載入，一個失敗不影響其他；中文字體依 unicode-range 分片，只下載用到的字。
     對方打開電子名片時，只載入那張名片用到的字體，不載入辨識和裁切的程式，打開比較快。 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
window.APP_VERSION = "0.8.0";
window.IS_ECARD = location.hash.indexOf("#c=") === 0;
(function(){
  var G = "https://fonts.googleapis.com/css2?family=", F = {
    sans:"Noto+Sans+TC:wght@400;500;700", serif:"Noto+Serif+TC:wght@600;700", wenkai:"LXGW+WenKai+TC:wght@400;700",
    sung:"Chiron+Sung+HK:wght@500;700", hei:"Chiron+Hei+HK:wght@400;500;700"};
  var need = null;
  if (IS_ECARD) {
    need = {sans:1};
    try {
      var b = location.hash.slice(3).replace(/-/g,"+").replace(/_/g,"/"); while (b.length % 4) b += "=";
      var bin = atob(b), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      var o = JSON.parse(new TextDecoder().decode(u));
      need[F[o.f] ? o.f : "serif"] = 1; if (F[o.ft]) need[o.ft] = 1;   // 名字和內文用使用者選的字體
    } catch (e) { need.serif = 1; }
  }
  for (var k in F) if (!need || need[k]) document.write('<link rel="stylesheet" href="' + G + F[k] + '&display=swap">');
  if (!IS_ECARD) ["cardparse.js","crop.js","paddle.js"].forEach(function(f){ document.write('<script src="' + f + '?v=' + APP_VERSION + '"><\/script>'); });
})();
</script>
<style>
/* Layout: phone app on a soft sage ground, rounded white tiles; my card is the one dark object on the page,
   collected cards stack like a card box. --card and --f-card are set from settings by JS. */
:root{
  --card:#2F5F51;
  /* 四組字體由設定改寫：名字、名片內文、介面標題、介面內文 */
  --f-card:"Noto Serif TC","Songti TC",serif;
  --f-cardtext:"Noto Sans TC","PingFang TC",sans-serif;
  --f-head:"Noto Sans TC","PingFang TC",sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 介面色系跟著名片顏色走：JS 依設定改寫 --L-*（淺色）與 --D-*（深色），這裡是深綠的預設值 */
  --L-bg:#E3EBE6; --L-soft:#EEF3F0; --L-ink:#1F3530; --L-muted:#5B7069; --L-line:#C2D0C8; --L-link:#2F5F51; --L-stack1:#C7D6CD; --L-stack2:#D6E2DA;
  --D-bg:#131A18; --D-surface:#1D2725; --D-soft:#253230; --D-ink:#E4ECE8; --D-muted:#9DB0A9; --D-line:#33423E; --D-link:#8CC4B1; --D-stack1:#2A3835; --D-stack2:#33433F;
  --bg:var(--L-bg); --surface:#FFFFFF; --soft:var(--L-soft); --ink:var(--L-ink); --muted:var(--L-muted); --line:var(--L-line);
  --strong:var(--L-ink); --strong-ink:#FFFFFF; --link:var(--L-link); --danger:#A23E37;
  --sand:#F3E9D6; --sand-ink:#5A4318; --stack1:var(--L-stack1); --stack2:var(--L-stack2);
  --t0:#F3E9D6; --t0i:#3D3020; --t1:#DCE6F0; --t1i:#1F2E3D; --t2:#E6DFF0; --t2i:#2E2440; --t3:#D3E0D8; --t3i:#1F3530; --t4:#F2DEDB; --t4i:#45231F;
  --brass:#E8C98A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:var(--D-bg); --surface:var(--D-surface); --soft:var(--D-soft); --ink:var(--D-ink); --muted:var(--D-muted); --line:var(--D-line);
  --strong:var(--D-ink); --strong-ink:var(--D-bg); --link:var(--D-link); --danger:#E7877E;
  --sand:#3A3122; --sand-ink:#EBD3A5; --stack1:var(--D-stack1); --stack2:var(--D-stack2);
  --t0:#3A3122; --t0i:#F0E2C6; --t1:#243241; --t1i:#D6E3F0; --t2:#30283D; --t2i:#E2D8F0; --t3:#22312B; --t3i:#D3E5DB; --t4:#3D2A28; --t4i:#F2D9D5;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:var(--D-bg); --surface:var(--D-surface); --soft:var(--D-soft); --ink:var(--D-ink); --muted:var(--D-muted); --line:var(--D-line);
  --strong:var(--D-ink); --strong-ink:var(--D-bg); --link:var(--D-link); --danger:#E7877E;
  --sand:#3A3122; --sand-ink:#EBD3A5; --stack1:var(--D-stack1); --stack2:var(--D-stack2);
  --t0:#3A3122; --t0i:#F0E2C6; --t1:#243241; --t1i:#D6E3F0; --t2:#30283D; --t2i:#E2D8F0; --t3:#22312B; --t3i:#D3E5DB; --t4:#3D2A28; --t4i:#F2D9D5;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-head);font-size:1.65rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em;line-height:1.3}
h2{font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.12em;margin:0}
p{margin:0}
a{color:var(--link)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:.9rem;color:var(--muted)}
.sub{color:var(--muted);font-size:.86rem}
button{font:inherit;cursor:pointer;color:inherit}
.pill{border:none;border-radius:999px;background:var(--surface);color:var(--ink);min-height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pill.strong{background:var(--strong);color:var(--strong-ink);font-weight:700}
.pill.big{min-height:56px;font-size:1.06rem;width:100%}
.pill.line{background:var(--soft);border:1.5px solid var(--line);font-weight:500}
.pill.line:active,.chip:active,.pill:active{transform:scale(.97)}
.pill.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.pill:disabled{opacity:.5;cursor:not-allowed}
.round{width:52px;height:52px;border-radius:50%;border:none;background:var(--strong);color:var(--strong-ink);display:grid;place-items:center;flex:none}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tile{background:var(--surface);border-radius:22px;padding:16px}
svg.i{width:22px;height:22px;flex:none}

/* ---------- my card ---------- */
.stackwrap{position:relative;padding-top:26px}
.stackwrap::before,.stackwrap::after{content:"";position:absolute;height:60px;border-radius:16px}
.stackwrap::before{left:26px;right:26px;top:0;background:var(--stack1)}
.stackwrap::after{left:13px;right:13px;top:12px;background:var(--stack2)}
.bcard{position:relative;z-index:1;width:100%;max-width:100%;aspect-ratio:91/54;border-radius:16px;background:var(--card);container-type:inline-size;overflow:hidden;
  box-shadow:0 20px 34px -20px rgba(20,40,35,.75)}
.bcard::after{content:"";position:absolute;right:-12cqw;top:-12cqw;width:44cqw;height:44cqw;border-radius:50%;background:#FFFFFF;opacity:.07}
.bcard .in{position:absolute;inset:0;padding:6cqw 6.5cqw;display:flex;flex-direction:column;justify-content:space-between;color:#F4F1EA;font-family:var(--f-cardtext)}
.bcard .org{display:flex;justify-content:space-between;gap:3cqw;font-size:3.1cqw;letter-spacing:.1em;color:rgba(255,255,255,.72)}
.bcard .org i{font-style:normal;color:var(--brass)}
.bcard .nm{font-family:var(--f-card);font-weight:700;font-size:8.8cqw;line-height:1.2;letter-spacing:.1em}
.bcard .tt{font-size:3.6cqw;color:var(--brass);letter-spacing:.18em}
.bcard .tg{font-size:3.2cqw;color:rgba(255,255,255,.74);margin-top:1cqw}
.bcard .ct{font-size:3.1cqw;color:rgba(255,255,255,.88);border-top:1px solid rgba(232,201,138,.5);padding-top:2.2cqw;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4cqw 4cqw;min-width:0;overflow-wrap:anywhere}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qrtile{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrtile svg{width:100%;max-width:140px;height:auto;display:block;border-radius:6px}
.stackcol{display:flex;flex-direction:column;gap:12px}
.mini{flex:1;border:none;border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:var(--surface);color:var(--ink);text-decoration:none;min-height:96px}
.mini.coffee{background:var(--sand);color:var(--sand-ink)}
.mini span{font-size:.92rem;font-weight:500}

form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=search],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus{border-color:var(--link);outline:none}
textarea{min-height:68px;resize:vertical}
textarea.grow{min-height:0;resize:none;overflow:hidden;line-height:1.45;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* ---------- card box ---------- */
.search{display:flex;flex-direction:row;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;min-height:48px;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;padding:0;border-radius:0}
.search input:focus{border:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.box{display:flex;flex-direction:column;padding-top:4px}
.strip{all:unset;box-sizing:border-box;cursor:pointer;height:78px;margin-top:-14px;border-radius:16px 16px 0 0;padding:13px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  box-shadow:0 -6px 12px -8px rgba(20,40,35,.35)}
.strip:first-child{margin-top:0;box-shadow:none}
.strip:focus-visible{outline:2px solid var(--link);outline-offset:-3px}
.strip .o{display:block;font-size:.7rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .n{display:block;font-family:var(--f-card);font-size:1.13rem;font-weight:700;letter-spacing:.04em}
.strip .d{font-size:.76rem;opacity:.75;flex:none}
.strip>span:first-child{min-width:0}
.t0{background:var(--t0);color:var(--t0i)} .t1{background:var(--t1);color:var(--t1i)} .t2{background:var(--t2);color:var(--t2i)} .t3{background:var(--t3);color:var(--t3i)} .t4{background:var(--t4);color:var(--t4i)}
.open{margin-top:-14px;border-radius:16px;background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:12px;position:relative;
  box-shadow:0 -6px 14px -8px rgba(20,40,35,.4),0 18px 30px -22px rgba(20,40,35,.5)}
.box .open:first-child,.list .open{margin-top:0}
.open .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.open .top>div{min-width:0}
.open .o{font-size:.74rem;color:var(--muted)}
.open .n{font-family:var(--f-card);font-size:1.5rem;font-weight:700;letter-spacing:.04em;line-height:1.3}
.open .n small{font-family:var(--f-ui);font-size:.82rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.badge{display:inline-block;font-family:var(--f-ui);font-size:.66rem;font-weight:500;border-radius:999px;padding:0 7px;background:var(--sand);color:var(--sand-ink);vertical-align:3px;margin-left:6px;letter-spacing:0}
/* 擬真紙本名片：用存好的正反面照片，點一下翻面（只有畫面特效，不另外存圖） */
.paper{display:flex;flex-direction:column;align-items:center;gap:8px}
.paper-btn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:block;perspective:1400px;max-width:100%}
.paper-btn:focus-visible{outline:3px solid var(--strong);outline-offset:4px;border-radius:8px}
.paper-in{position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.paper.flip .paper-in{transform:rotateY(180deg)}
.face{border-radius:6px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#FBF9F4;
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 2px 0 rgba(0,0,0,.14),0 16px 26px -16px rgba(20,40,35,.6)}
.face img{display:block;max-width:100%;max-height:min(290px,38vh);width:auto;height:auto}
.face.back{position:absolute;inset:0;transform:rotateY(180deg);display:flex}
.face.back img{width:100%;height:100%;max-height:none;object-fit:contain}
.face.txt{background:var(--card);color:#F4F1EA;flex-direction:column;justify-content:space-between;padding:7% 7%;font-size:clamp(.62rem,2.6vw,.8rem);line-height:1.45;text-align:left}
.face.txt b{font-family:var(--f-card);font-size:1.35em;letter-spacing:.08em}
.face.txt .g{display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.face.txt .g span:nth-child(odd){opacity:.75}
.face.txt .g span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face.txt .f{opacity:.8;border-top:1px solid rgba(255,255,255,.3);padding-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paper-bar{display:flex;align-items:center;gap:8px;width:100%;font-size:.8rem;color:var(--muted)}
.paper-bar .dots{display:flex;gap:5px}
.paper-bar .dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box}
.paper-bar .dots i.on{background:var(--ink);border-color:var(--ink)}
.paper-bar .sp{flex:1}
.paper-bar .pill{white-space:nowrap;flex:none}
.iconbtn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:var(--soft);color:var(--ink);display:grid;place-items:center;padding:0}
@media (prefers-reduced-motion:reduce){.paper-in{transition:none}}
.zoom{position:fixed;inset:0;z-index:28;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.zoom img{max-width:100%;max-height:calc(100vh - 110px);object-fit:contain;border-radius:4px}
.zoom .row2{width:min(100%,420px)}
.zoom .pill.line{color:#F2F5F3;border-color:#4A5853}
.wishes{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.wishes .wst{display:inline-block;font-size:.72rem;background:var(--soft);border-radius:999px;padding:2px 8px;margin-right:8px}
.pwho{margin:0;text-align:center;font-size:.85rem;color:var(--muted)}
.pwho.personal{color:var(--strong-ink);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;align-self:center}
.supportnote p{margin:0 0 6px}
.eng{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.eng.on{border-color:var(--strong);box-shadow:0 0 0 1px var(--strong) inset}
.eng p{margin:4px 0}
.engst{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.lrn{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.lrn li{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:40px}
.lrn li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.tok small{margin-left:4px}
.memo{font-size:.86rem;background:var(--soft);border-radius:12px;padding:10px 12px;white-space:pre-line}
.kv{display:grid;grid-template-columns:3.6em 1fr;gap:4px 10px;margin:0;font-size:.9rem}
.kv dt{color:var(--muted);font-size:.8rem;padding-top:2px}
.hist{display:flex;flex-direction:column;gap:8px}
.hist h3{margin:4px 0 0;font-size:.9rem}
.hrow{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:10px}
.hthumb{all:unset;cursor:pointer;flex:none;width:84px;border-radius:4px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.12),0 6px 10px -6px rgba(20,40,35,.5)}
.hthumb:focus-visible{outline:3px solid var(--strong);outline-offset:2px}
.hthumb img{display:block;width:100%}
.hrow .ho{font-size:.9rem;font-weight:500}
.hrow .ht{font-size:.82rem;color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(20,32,29,.5);z-index:7}
.cmp{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:center}
.cmp>div{background:var(--soft);border-radius:12px;padding:10px;font-size:.82rem;min-width:0;overflow-wrap:anywhere}
.cmp>div.new{box-shadow:0 0 0 2px var(--strong) inset}
.cmp .k{font-size:.72rem;color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts>*{flex:1 1 90px}
.acts button,.acts a{min-height:44px;border-radius:12px;border:none;background:var(--soft);color:var(--ink);font-size:.84rem;display:grid;place-items:center;text-decoration:none}
.acts .main{flex-basis:100%;background:var(--strong);color:var(--strong-ink);font-weight:700;font-size:.95rem;min-height:48px}
.kv .num{font:inherit;color:var(--link);background:none;border:none;padding:0;text-align:left;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:28px}
.nummenu{display:flex;gap:8px;margin:6px 0 4px}
.nummenu a,.nummenu button{flex:1;min-height:44px;border-radius:12px;border:none;background:var(--soft);color:var(--ink);font:inherit;font-size:.86rem;display:grid;place-items:center;text-decoration:none}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quick .mini{min-height:88px}
.photobtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.slot{aspect-ratio:91/54;border-radius:12px;overflow:hidden;background:var(--soft);display:grid;place-items:center}
.slot img{width:100%;height:100%;object-fit:cover}
.slot.empty{border:2px dashed var(--line);color:var(--muted);font-size:.86rem}
.pill.small{min-height:38px;padding:0 12px;font-size:.84rem}
.hint{color:var(--link)}
.open .alt{font-size:.84rem;color:var(--muted)}
.viewer{display:flex;flex-direction:column;align-items:center;gap:10px;perspective:900px}
.del{gap:4px}
@media (prefers-reduced-motion:no-preference){.turn{animation:turn .45s cubic-bezier(.3,.7,.2,1)}@keyframes turn{from{transform:rotateY(90deg)}to{transform:none}}}
.scanner{position:fixed;inset:0;z-index:25;background:#000000;color:#FFFFFF}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* 電子名片的美術樣式（對方看到的頁面）：甲 紙感、乙 插畫、丙 直排；全部用 CSS／SVG 畫，不另外下載圖檔 */
.pdraw{margin:0;text-align:center;font-size:.85rem;color:var(--muted)}
.pdraw b{color:var(--ink)}
.stylechips{display:flex;flex-wrap:wrap;gap:8px}

body.es{--surface:rgba(255,255,255,.66);--soft:rgba(255,255,255,.5);--strong:var(--acc);--strong-ink:#FFFFFF;--link:var(--acc);overflow-x:hidden}
body.es-paper{--bg:#EFEBE3;--ink:#2A2A26;--muted:#857D70;background:#EFEBE3 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .4 0 0 0 0 .33 0 0 0 .13 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
body.es-illu{--bg:#EEF2EE;--ink:#263430;--muted:#587569}
body.es-vert{--bg:#F7F2E7;--ink:#22201C;--muted:#776D5F}
.art{container-type:inline-size;font-family:var(--f-cardtext);animation:artin .95s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 60%}

.pp-nm{font-family:var(--f-card);font-weight:700;font-size:8.6cqw;letter-spacing:.2em;color:#23312C;line-height:1.25;text-shadow:0 1px 0 #FFFFFF}

.art.illu{position:relative;padding-top:68cqw}

.importbox{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}

.list{display:flex;flex-direction:column;gap:10px}

/* ---------- settings ---------- */
.set{display:flex;flex-direction:column;gap:12px}
.choices{display:grid;gap:8px}
.choices.fonts{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border-radius:16px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:2px;min-width:0;border:2px solid transparent}

.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}

.frole{display:flex;flex-direction:column;gap:8px}

.frow{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.flbl{font-weight:500;font-size:.95rem}
.fchips{display:flex;flex-wrap:wrap;gap:8px}

.check{flex-direction:row;align-items:center;gap:12px;color:var(--ink);font-size:.95rem;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--card);margin:0}
.preview-sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:10px 14px;margin-block:-10px 0}
.preview-sticky .bcard{max-width:340px;margin:0 auto;display:block}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);display:flex;justify-content:center;gap:10px;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}

/* ---------- give card ---------- */

.pcard{width:min(100%,520px)}

.crop-stage svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.crop-stage .shade{fill:rgba(0,0,0,.55)}
.crop-stage .edge{fill:none;stroke:#F2C14E;stroke-width:2.5;vector-effect:non-scaling-stroke}
.hdl{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border:0;background:transparent;padding:0;touch-action:none;cursor:grab;display:grid;place-items:center}
.hdl span{width:22px;height:22px;border-radius:50%;background:#F2C14E;border:3px solid #151B19;box-shadow:0 0 0 2px #F2C14E}
.hdl:focus-visible span{box-shadow:0 0 0 4px #fff}

.loupe::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;border:2px solid #F2C14E}
.crop-prev{display:flex;align-items:center;gap:12px;justify-content:center}
.crop-prev canvas{max-width:150px;max-height:110px;border-radius:4px;background:#2A332F}
.crop-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.crop-acts button{min-height:46px;border-radius:999px;border:1px solid #4A5853;background:transparent;color:#F2F5F3;font:inherit;font-size:.9rem}
.crop-acts .go{grid-column:1 / -1;background:#F2C14E;color:#1B1F1D;border:0;font-weight:700;font-size:1rem;min-height:52px}

const SHOW_FIELDS = [["phone","電話"],["email","Email"],["line","LINE ID"],["web","網站"],["tagline","一句話介紹"]];
const DEFAULT_SETTINGS = {cardColor:"green", fonts:{name:"serif",cardText:"sans",head:"sans",body:"sans"}, theme:"system", bookView:"box", presentFlip:true, qrWork:"vcard", qrPersonal:"ecard", cardColorPersonal:"plum", styleWork:"classic", stylePersonal:["paper","illu","vert"],

const DEFAULT = {

  cards:[
    {id:"s1",sample:true,name:"陳志明",title:"產品經理",org:"範例科技股份有限公司",phone:"0912-000-000",email:"chen@example.com",line:"chenpm",note:"開發者聚會認識",added:"2026-09-18",photo:""},
    {id:"s2",sample:true,name:"林怡君",title:"行銷企劃",org:"範例文創有限公司",phone:"02-2800-0000",email:"lin@example.org",line:"",note:"設計展攤位認識，聊到合作活動",added:"2026-10-02",photo:""},
    {id:"s3",sample:true,name:"李佩珊",title:"會計師",org:"範例聯合會計師事務所",phone:"02-2890-0000",email:"lee@example.org",line:"",note:"朋友介紹，報稅問題可以找她",added:"2026-10-11",photo:""}
  ],
  settings:DEFAULT_SETTINGS

const clone = o => JSON.parse(JSON.stringify(o));
let data = null;   // 由 boot() 從 IndexedDB 載入
const ui = {tab:"me", editing:false, adding:false, draftPhoto:"", query:"", sort:"recent", photoOnly:false,
  openId:null, confirmId:null, paperBack:false, zoom:null, confirmReset:false, lock:null, importing:null,
  draftBack:"", editId:null, snapSide:"front",
  review:{tokens:[]}, rv:{open:false, sel:null, mode:null, side:"front"}};
const hostTheme = null;

/* ---------- 儲存：IndexedDB，容量比 localStorage 大很多，照片放得下 ---------- */
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{ const r=indexedDB.open("bizcard",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");
    r.onsuccess=()=>{ _db=r.result; res(_db); }; r.onerror=()=>rej(r.error); });
}
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=tx.onabort=()=>rej(tx.error); }); }

const str = v => typeof v==="string" ? v.slice(0,500) : "";
const PHOTO_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function cleanCard(c){   // 匯入的檔案不可信：只留已知欄位、只接受圖片格式的照片
  return {id:str(c.id).replace(/[^\w-]/g,"").slice(0,40)||("c"+Math.random().toString(36).slice(2)), sample:!!c.sample,
    name:str(c.name), title:str(c.title), org:str(c.org), phone:str(c.phone), tel:str(c.tel), fax:str(c.fax), email:str(c.email), line:str(c.line),
    web:str(c.web), address:str(c.address), ocrText:typeof c.ocrText==="string"?c.ocrText.slice(0,4000):"",
    note:str(c.note), alt:str(c.alt), added:/^\d{4}-\d{2}-\d{2}$/.test(c.added)?c.added:today(),
    photo:(typeof c.photo==="string"&&PHOTO_RE.test(c.photo))?c.photo:"",
    photoBack:(typeof c.photoBack==="string"&&PHOTO_RE.test(c.photoBack))?c.photoBack:"",
    history:Array.isArray(c.history)?c.history.slice(0,10).map(h=>({org:str(h&&h.org), title:str(h&&h.title), phone:str(h&&h.phone), tel:str(h&&h.tel),
      email:str(h&&h.email), address:str(h&&h.address), added:/^\d{4}-\d{2}-\d{2}$/.test(h&&h.added)?h.added:"", until:/^\d{4}-\d{2}-\d{2}$/.test(h&&h.until)?h.until:"",
      photo:(h&&typeof h.photo==="string"&&PHOTO_RE.test(h.photo))?h.photo:""})):[]};
}
const ME_KEYS=["name","title","org","tagline","phone","email","line","web","address","intro"];
const safeUrl = u => { u=str(u).trim(); if(!u) return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u; try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:""; }catch(e){ return ""; } };
function cleanMe(m){
  const o={}; ME_KEYS.forEach(k=>o[k]=str(m&&m[k]));
  o.intro=o.intro.slice(0,INTRO_MAX);
  o.links=(Array.isArray(m&&m.links)?m.links:[]).slice(0,3).map(l=>({label:str(l&&l.label).slice(0,30), url:safeUrl(l&&l.url)})).filter(l=>l.url);
  return o;
}
const PROFILE_LABEL={work:"工作版", personal:"個人版"};
const me = () => data.profiles[data.active] || data.profiles.work;
const colorKey = () => data.active==="personal" ? data.settings.cardColorPersonal : data.settings.cardColor;   // 工作版、個人版各自的主題色
const qrKey = () => data.active==="personal" ? "qrPersonal" : "qrWork";
const qrMode = () => data.settings[qrKey()];

/* ---------- 從使用者的整理學習 ----------
   在「整理文字」把一塊字放到和自動判斷不同的地方，存檔時就記下來，下次遇到一樣的字直接照做。
   只學單位、職稱、備註和「不要用」；姓名、電話、Email、地址是個人資料，不學。全部只存在這支手機（和使用者自己的備份）。 */
const LEARN_FIELDS=["org","title","note",""];
const LEARN_MAX=400;
function cleanLearn(l){
  l=(l&&typeof l==="object")?l:{};
  const exact={};
  if(l.exact && typeof l.exact==="object") Object.entries(l.exact).slice(-LEARN_MAX).forEach(([k,v])=>{ k=str(k).slice(0,80); if(k && LEARN_FIELDS.includes(v)) exact[k]=v; });
  const words=a=>Array.isArray(a)?[...new Set(a.map(x=>str(x).slice(0,12)).filter(Boolean))].slice(-100):[];
  return {exact, titles:words(l.titles), orgs:words(l.orgs)};
}
function learnFromReview(){
  const toks=(ui.review&&ui.review.tokens)||[], L=data.learn; let n=0;
  const hasName=toks.some(t=>t.field==="name");
  const cjk=/[㐀-鿿]/;
  for(const t of toks){
    const before=t.orig||null, after=t.field||null;
    if(t.bulk && t.field==="note") continue;   // 「背面全部放進備註」是一次性的整理，不當成規則
    if((before===after && !(after===null && !before)) || t.kind==="email" || t.kind==="phone" || t.kind==="tel" || t.kind==="web") continue;
    const key=CardParse.learnKey(t.raw||t.text); if(!key || key.length>80) continue;
    if(after==="org"||after==="title"||after==="note"){ L.exact[key]=after; n++; }
    else if(after===null && before){ L.exact[key]=""; n++; }
    // 存檔時還沒用到的文字（不是像姓名的那種），也當成「不要用」，下次就不會再停在整理畫面
    else if(after===null && !before && key.length<=20 && !["enName","address","fax","skip"].includes(t.kind)
      && (t.kind!=="nameCand" || hasName)){ L.exact[key]=""; n++; }   // 像姓名的字，只有在姓名已經另外放好時才記
    else continue;
    const txt=(t.text||"").replace(/\s+/g,"");
    if(after==="title" && cjk.test(txt) && txt.length>=2 && txt.length<=8 && !CardParse.knownTitle(txt) && !L.titles.includes(txt)) L.titles.push(txt);
    if(after==="org" && cjk.test(txt) && txt.length>=4 && !CardParse.knownOrg(txt)){ const suf=txt.slice(-3); if(!L.orgs.includes(suf)) L.orgs.push(suf); }
  }
  if(n){ const e=Object.entries(L.exact); if(e.length>LEARN_MAX) L.exact=Object.fromEntries(e.slice(-LEARN_MAX)); L.titles=L.titles.slice(-100); L.orgs=L.orgs.slice(-100); }
  return n;
}
function learnHTML(){

    + '<p class="sub">在「整理文字」把文字放到不同的地方，存檔時會記下來，下次直接照做。只記單位、職稱、備註和不要用的文字，姓名和聯絡方式不記。</p>'

      + L.titles.map(w=>'<li><span>'+esc(w)+'</span><span class="sub">→ 職稱用詞</span><button type="button" class="textbtn" data-act="learnDel" data-t="t" data-k="'+esc(w)+'" aria-label="刪除這條">刪除</button></li>').join("")
      + L.orgs.map(w=>'<li><span>…'+esc(w)+'</span><span class="sub">→ 單位結尾</span><button type="button" class="textbtn" data-act="learnDel" data-t="o" data-k="'+esc(w)+'" aria-label="刪除這條">刪除</button></li>').join("")
      + '</ul><button type="button" class="pill line small" data-act="learnClear">全部清除</button>'
      : '<p class="sub">還沒有。</p>')
    + '</details>';
}
function normalize(d){
  if(!d || !(d.me||d.profiles) || !Array.isArray(d.cards)) d=clone(DEFAULT);
  const mt=(d.meta&&typeof d.meta==="object")?d.meta:{};
  const pf=(d.profiles&&typeof d.profiles==="object")?d.profiles:{work:d.me};   // 舊版只有一張「我的名片」→ 變成工作版
  d={profiles:{work:cleanMe(pf.work), personal:cleanMe(pf.personal)}, active:d.active==="personal"?"personal":"work",
     cards:d.cards.filter(c=>c&&typeof c==="object").map(cleanCard), settings:d.settings,
     learn:cleanLearn(d.learn),
     meta:{cloudConnected:!!mt.cloudConnected, lastCloud:str(mt.lastCloud), lastChange:str(mt.lastChange), supportShown:!!mt.supportShown,
       lastBackup:str(mt.lastBackup), sinceBackup:Number.isFinite(mt.sinceBackup)?mt.sinceBackup:null, snoozeAt:Number.isFinite(mt.snoozeAt)?mt.snoozeAt:0,
       seenVersion:str(mt.seenVersion), tips:(mt.tips&&typeof mt.tips==="object")?mt.tips:{}}};
  if(d.meta.sinceBackup===null) d.meta.sinceBackup = d.meta.lastBackup ? 0 : d.cards.filter(c=>!c.sample).length;   // 舊資料：還沒備份過，就從現有的名片算起
  const s=Object.assign(clone(DEFAULT_SETTINGS), d.settings||{});
  s.show=Object.assign(clone(DEFAULT_SETTINGS.show), (d.settings&&d.settings.show)||{});
  s.ocr=Object.assign({enabled:true, ready:false, jpn:false, chi_sim:false, engine:"paddle", paddleReady:false}, (d.settings&&d.settings.ocr)||{});
  if(s.ocr.engine!=="tess") s.ocr.engine="paddle";
  if(!CARD_COLORS[s.cardColor]) s.cardColor=DEFAULT_SETTINGS.cardColor;   // 舊版設定遷移
  if(!d.settings || !CARD_COLORS[d.settings.cardColorPersonal]) s.cardColorPersonal = s.cardColor==="plum"?"navy":"plum";   // 個人版預設和工作版不同色
  ["qrWork","qrPersonal"].forEach(k=>{ if(s[k]!=="vcard" && s[k]!=="ecard") s[k]=DEFAULT_SETTINGS[k]; });
  delete s.qrMode;
  if(!ESTYLES[s.styleWork]) s.styleWork="classic";
  s.stylePersonal=(Array.isArray(s.stylePersonal)?s.stylePersonal:[]).filter((k,i,a)=>ESTYLES[k]&&a.indexOf(k)===i);
  if(!s.stylePersonal.length) s.stylePersonal=DEFAULT_SETTINGS.stylePersonal.slice();
  s.fonts=Object.assign(clone(DEFAULT_SETTINGS.fonts), (d.settings&&d.settings.fonts)||{});
  if(d.settings && d.settings.cardFont && !d.settings.fonts && FONTS[d.settings.cardFont]) s.fonts.name=d.settings.cardFont; // 舊版只有名字字體
  Object.keys(s.fonts).forEach(k=>{ if(!FONTS[s.fonts[k]]) s.fonts[k]=DEFAULT_SETTINGS.fonts[k]; });
  delete s.cardFont;
  if(!VIEWS[s.bookView]) s.bookView="box";
  d.settings=s; return d;
}
function save(opts){
  if(!(opts&&opts.quiet)) data.meta.lastChange=new Date().toISOString();
  idbSet("data", data).catch(()=>toast("沒存進去：手機空間不足或瀏覽器不允許儲存。"));
  return true;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vesc = s => String(s ?? "").replace(/\\/g,"\\\\").replace(/[,;]/g, m => "\\"+m).replace(/\n/g,"\\n");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const short = d => (d||"").slice(5);
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; t.classList.toggle("top", !!document.querySelector(".sheet")); clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); }
function greeting(){ const h=new Date().getHours(); return h<5?"夜深了":h<11?"早安":h<14?"午安":h<18?"午後好":"晚安"; }
function tint(id){ let n=0; for(const ch of String(id)) n+=ch.charCodeAt(0); return "t"+(n%5); }

function applySettings(){
  const s=data.settings, r=document.documentElement;
  const pal=CARD_COLORS[colorKey()]||CARD_COLORS.green;
  r.style.setProperty("--card", pal.c);
  Object.entries(pal.L).forEach(([k,v])=>r.style.setProperty("--L-"+k, v));
  Object.entries(pal.D).forEach(([k,v])=>r.style.setProperty("--D-"+k, v));
  FONT_ROLES.forEach(role=>r.style.setProperty(role.cssVar, FONTS[s.fonts[role.key]].stack));
  if(s.theme==="system"){ hostTheme ? r.setAttribute("data-theme",hostTheme) : r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", s.theme);
  // 手機狀態列的顏色跟著底色
  const dark = s.theme==="dark" || (s.theme==="system" && matchMedia("(prefers-color-scheme: dark)").matches);
  const meta=document.getElementById("themeColor"); if(meta) meta.content = dark ? pal.D.bg : pal.L.bg;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{ if(data) applySettings(); });

function vcard(m){
  const L=["BEGIN:VCARD","VERSION:3.0","N:;"+vesc(m.name)+";;;","FN:"+vesc(m.name)];
  if(m.org) L.push("ORG:"+vesc(m.org));
  if(m.title) L.push("TITLE:"+vesc(m.title));
  if(m.phone) L.push("TEL;TYPE=CELL:"+m.phone.replace(/[^\d+]/g,""));
  if(m.tel) L.push("TEL;TYPE=WORK:"+m.tel.replace(/\s*#\s*/,",").replace(/[^\d+,]/g,""));
  if(m.fax) L.push("TEL;TYPE=WORK,FAX:"+m.fax.replace(/[^\d+]/g,""));
  if(m.email) L.push("EMAIL:"+vesc(m.email));
  if(m.web) L.push("URL:"+vesc(m.web));
  if(m.address) L.push("ADR;TYPE=WORK:;;"+vesc(m.address)+";;;;");
  const note=[m.line&&("LINE: "+m.line), m.alt, m.note].filter(Boolean).join(" / ");
  if(note) L.push("NOTE:"+vesc(note));
  L.push("END:VCARD"); return L.join("\r\n");
}
function plainText(m){
  return [m.name+(m.title?"｜"+m.title:""), m.org, m.tagline, m.phone&&("電話 "+m.phone), m.email&&("Email "+m.email), m.line&&("LINE "+m.line), m.web].filter(Boolean).join("\n");
}
function qrSvg(text){
  if(!window.qrcode) return '<p class="sub">QR code 元件沒有載入，請重新整理頁面。</p>';
  try{
    if(qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
    const q=qrcode(0,"M"); q.addData(text,"Byte"); q.make();
    const n=q.getModuleCount(); let d="";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+="M"+c+" "+r+"h1v1h-1z";
    return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" role="img" aria-label="名片 QR code" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#FFFFFF"/><path d="'+d+'" fill="#1F3530"/></svg>';
  }catch(e){ return '<p class="sub">資料太長，QR code 放不下。請縮短網站或介紹。</p>'; }
}

function filtered(){
  const q=ui.query.trim().toLowerCase();
  let list=data.cards.filter(c=>!ui.photoOnly || c.photo || c.photoBack);
  if(q) list=list.filter(c=>[c.name,c.alt,c.org,c.title,c.note,c.phone,c.tel,c.fax,c.email,c.line,c.web,c.address,c.ocrText].concat((c.history||[]).flatMap(h=>[h.org,h.title])).join(" ").toLowerCase().includes(q));
  if(ui.sort==="org") list.sort((a,b)=>(a.org||"").localeCompare(b.org||"","zh-Hant")||(a.name||"").localeCompare(b.name||"","zh-Hant"));
  else list.sort((a,b)=>(a.added||"").localeCompare(b.added||"")); // 舊的在上，最新的在最下面展開
  return list;
}
/* ---------- 同一個人的新名片 ---------- */
const digits = s => String(s||"").split("#")[0].replace(/\D/g,"");
function findSame(f){
  const nm = s => String(s||"").replace(/\s/g,"").toLowerCase();
  if(!nm(f.name)) return null;
  for(const c of data.cards){
    if(c.sample || nm(c.name)!==nm(f.name)) continue;
    const mine=[c.phone,c.tel].map(digits).filter(Boolean);
    if(digits(f.phone) && mine.includes(digits(f.phone))) return {card:c, why:"手機號碼相同"};
    if(digits(f.tel) && mine.includes(digits(f.tel))) return {card:c, why:"電話號碼相同"};
    if(f.email && c.email && f.email.toLowerCase()===c.email.toLowerCase()) return {card:c, why:"Email 相同"};
  }
  return null;
}
function shrinkPhoto(url){   // 舊名片只留縮小的正面（約 30–50KB）
  return new Promise(res=>{ if(!url) return res(""); const im=new Image();
    im.onload=()=>{ const s=Math.min(1,560/Math.max(im.width,im.height)), c=document.createElement("canvas"); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
      c.getContext("2d").drawImage(im,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.6)); };
    im.onerror=()=>res(""); im.src=url; });
}
async function applyNewVersion(old, f){
  const h={org:old.org, title:old.title, phone:old.phone, tel:old.tel, email:old.email, address:old.address, added:old.added, until:today(), photo:await shrinkPhoto(old.photo)};
  old.history=[h].concat(old.history||[]).slice(0,10);
  const note=[old.note, f.note].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join("\n");
  // 個人的聯絡方式（手機、LINE、外文名）新名片沒寫就沿用；工作相關的照新名片
  const keep={phone:f.phone||old.phone, line:f.line||old.line, alt:f.alt||old.alt};
  Object.assign(old, f, keep, {note, added:today(), sample:false});
}
function histHit(c, q){
  if(!q) return null;
  const now=[c.name,c.alt,c.org,c.title,c.note,c.phone,c.tel,c.email,c.line,c.web,c.address,c.ocrText].join(" ").toLowerCase();
  if(now.includes(q)) return null;
  return (c.history||[]).find(h=>[h.org,h.title].join(" ").toLowerCase().includes(q))||null;
}

async function finishAdd(fields, mode, targetId){
  try{ await finishAddInner(fields, mode, targetId); }
  catch(e){ console.error(e); toast("沒有存成功，請把 app 完全關掉再打開後重試"); }
}
async function finishAddInner(fields, mode, targetId){
  let learned=0; try{ learned=learnFromReview(); }catch(e){ console.error(e); }   // 學習失敗不能擋住存檔
  ui.auto=new Set(); ui.ocrAsk=null; ocrCancel(); resetReview(); cropKeep.src={}; ui.same=null;
  let card, msg;
  if(mode==="edit" && (card=data.cards.find(x=>x.id===ui.editId))){ Object.assign(card, fields, {sample:false}); msg="已儲存修改"; }
  else if(mode==="update" && (card=data.cards.find(x=>x.id===targetId))){ await applyNewVersion(card, fields); msg="已更新，舊的收進「以前的名片」"; }
  else {
    card=Object.assign({id:"c"+Date.now().toString(36), added:today()}, fields); data.cards.push(card); msg="已存入名片夾";
    if(ui.demo){ card.sample=true; msg="已存入名片夾（標成範例，可以在設定裡一起移除）"; }
    else data.meta.sinceBackup=(data.meta.sinceBackup||0)+1;
  }
  ui.demo=false;
  save();
  ui.adding=false; ui.editId=null; ui.newFor=null; ui.draft=null; ui.draftPhoto=""; ui.draftBack=""; ui.openId=card.id; ui.paperBack=false; ui.query=""; render();
  toast(msg+(learned?"；記下了 "+learned+" 條你的整理方式":""));
}

function opt(group,key,inner,cur){ return '<button type="button" class="opt" data-act="set" data-group="'+group+'" data-key="'+key+'" aria-pressed="'+(cur===key)+'">'+inner+'</button>'; }
function photoCount(cards){ let n=0; cards.forEach(c=>{ n+=(c.photo?1:0)+(c.photoBack?1:0)+(c.history||[]).filter(h=>h.photo).length; }); return n; }
function backupSizeText(){
  const real=data.cards.filter(c=>!c.sample); if(!real.length) return "";
  let b=4000; real.forEach(c=>{ b+=1500+(c.ocrText||"").length*3+(c.photo||"").length+(c.photoBack||"").length+(c.history||[]).reduce((t,h)=>t+(h.photo||"").length+300,0); });
  const mb=b/1048576;
  return '目前的備份檔約 '+(mb<1?Math.max(1,Math.round(b/1024))+'KB':mb.toFixed(1)+'MB')+'（'+real.length+' 張名片、'+photoCount(real)+' 張照片）。'+(mb>20?'Gmail 附件上限約 25MB，太大的話請改存雲端硬碟。':'');
}
function textOnly(p){
  p.cards=p.cards.map(c=>Object.assign({}, c, {photo:"", photoBack:"", history:(c.history||[]).map(h=>Object.assign({}, h, {photo:""}))}));
  p.textOnly=true; return p;
}

const mb = b => b>=1048576 ? (b/1048576).toFixed(1)+"MB" : Math.max(1,Math.round(b/1024))+"KB";
async function tessUsage(){
  let b=0;
  try{ for(const n of await caches.keys()){ const c=await caches.open(n); for(const r of await c.keys()){ if(/tesseract/i.test(r.url)){ const x=await c.match(r); b+=+(x.headers.get("Content-Length")||0)||(await x.blob()).size; } } } }catch(e){}
  try{ b+=await new Promise(res=>{ const q=indexedDB.open("keyval-store"); q.onerror=()=>res(0);
    q.onsuccess=()=>{ const db=q.result; if(!db.objectStoreNames.contains("keyval")){ db.close(); return res(0); }
      let t=0; const cur=db.transaction("keyval").objectStore("keyval").openCursor();
      cur.onsuccess=()=>{ const c=cur.result; if(!c){ db.close(); return res(t); } const v=c.value; t+=v&&(v.byteLength||v.length||v.size)||0; c.continue(); };
      cur.onerror=()=>{ db.close(); res(t); }; }; }); }catch(e){}
  return b;
}
async function refreshOcrUsage(){
  const o=data.settings.ocr;
  const set=(id,t)=>{ const el=document.getElementById(id); if(el) el.textContent=t; };
  if(o.paddleReady){ const ok=window.PaddleOCR&&await PaddleOCR.isReady(); if(!ok){ o.paddleReady=false; save({quiet:true}); set("engsize-paddle","未下載・"+ENGINES.paddle.size); } else set("engsize-paddle","已下載・"+mb(await PaddleOCR.usage())); }
  if(o.ready){ const b=await tessUsage(); set("engsize-tess", b?"已下載・"+mb(b):"已下載"); }
  try{ const e=await navigator.storage.estimate(); set("appUsage","這個 app 目前在手機上使用的空間：約 "+mb(e.usage||0)+"（含名片照片和辨識資料）"); }catch(e){ set("appUsage",""); }
}
async function deleteTess(){
  if(ocr.worker){ try{ await ocr.worker.terminate(); }catch(e){} ocr.worker=null; }
  try{ for(const n of await caches.keys()){ const c=await caches.open(n); for(const r of await c.keys()) if(/tesseract/i.test(r.url)) await c.delete(r); } }catch(e){}
  await new Promise(res=>{ try{ const q=indexedDB.deleteDatabase("keyval-store"); q.onsuccess=q.onerror=q.onblocked=()=>res(); }catch(e){ res(); } });
  data.settings.ocr.ready=false; save({quiet:true});
}

function compress(file){

const val = id => { const el=document.getElementById(id); if(!el) return ""; const v=el.value||""; return (el.classList.contains("grow")?v.replace(/\s*\n\s*/g," "):v).trim(); };

/* ---------- 自動裁切：拍完先找名片四個角，使用者可以拖曳微調，確定後只存裁切好的照片 ----------
   原圖只留在記憶體裡（cropKeep.src），存檔或取消後就丟掉；存檔前都可以按「調整範圍」重裁。 */
const cropKeep={src:{}};
const CROP_FULL=[[0,0],[1,0],[1,1],[0,1]], CROP_INSET=[[.06,.06],[.94,.06],[.94,.94],[.06,.94]];

async function loadWork(file){
  let src;
  try{ src=await createImageBitmap(file,{imageOrientation:"from-image"}); }
  catch(e){ src=await new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image(); im.onload=()=>{ URL.revokeObjectURL(u); res(im); }; im.onerror=rej; im.src=u; }); }

  const c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height); src.close&&src.close();
  return c;
}
function canvasURL(c, maxSide, q){
  const s=Math.min(1,maxSide/Math.max(c.width,c.height)); if(s===1) return c.toDataURL("image/jpeg",q);
  const d=document.createElement("canvas"); d.width=Math.round(c.width*s); d.height=Math.round(c.height*s);

async function openCrop(side, file, recrop){

    let q=keep?keep.q:CardCrop.detectCanvas(canvas);
    const found=!!q;
    ui.crop={side, recrop:!!recrop, canvas, url:canvasURL(canvas,1100,.8), q:(q||CROP_INSET).map(p=>p.slice()), found, rot:keep?keep.rot:0};

    + '<div class="crop-stage" id="cropStage" style="aspect-ratio:'+ar.toFixed(4)+';width:min(100%, calc(56vh * '+ar.toFixed(4)+'))">'

    + c.q.map((p,i)=>'<button type="button" class="hdl" data-i="'+i+'" aria-label="'+CORNER_LABEL[i]+'，可以用方向鍵移動" style="left:'+(p[0]*100)+'%;top:'+(p[1]*100)+'%"><span></span></button>').join("")
    + '<div class="loupe" id="loupe" hidden></div></div>'
    + '<div class="crop-prev"><span class="sub">裁切後</span><canvas id="cropPrev" width="1" height="1" role="img" aria-label="裁切後的預覽"></canvas></div>'

function cropUpdate(){

function cropPreview(){

function cropLoupe(i){

const cropDrag={i:null};
document.addEventListener("pointerdown", e=>{

const cropEnd=()=>{ if(cropDrag.i==null) return; cropDrag.i=null; cropLoupe(null); cropPreview(); };

  if(ui.zoom && e.key==="Escape"){ ui.zoom=null; renderZoom(); return; }

// 交出檔案：手機上跳出分享選單（可以直接存到 Google Drive），不支援的瀏覽器就直接下載
async function deliver(filename, text, mime){
  const blob=new Blob([text],{type:mime});
  try{
    const file=new File([blob], filename, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast("已下載 "+filename);
}

function backupPayload(){

function prepareImport(d){   // 檔案或雲端讀回來的備份：先列出差異，讓使用者決定要加入哪些

/* ---------- Google Drive 雲端備份 ----------
   只申請 drive.file：app 只看得到自己建立的那個備份檔，碰不到使用者雲端硬碟的其他檔案。
   網頁拿到的授權約一小時過期，重新授權需要使用者點按，所以採「按一下備份」加上提醒，不做背景自動上傳。 */
const CLOUD_FILE = "名片夾備份.json";
const DRIVE = "https://www.googleapis.com/drive/v3/files";
const cloud = {token:"", exp:0, client:null, pending:null};
function initCloud(){
  if(!GDRIVE_CLIENT_ID || document.getElementById("gis")) return;
  const s=document.createElement("script"); s.id="gis"; s.src="https://accounts.google.com/gsi/client"; s.async=true;
  s.onload=()=>{
    if(!window.google || !google.accounts) return;   // 元件沒載入成功（例如離線）：按備份時會提示稍後再試
    cloud.client=google.accounts.oauth2.initTokenClient({
      client_id:GDRIVE_CLIENT_ID, scope:"https://www.googleapis.com/auth/drive.file",
      callback:r=>{ const p=cloud.pending; cloud.pending=null; if(!p) return;
        if(r.error){ p.rej(new Error(r.error)); return; }
        cloud.token=r.access_token; cloud.exp=Date.now()+(Number(r.expires_in)||3600)*1000; p.res(cloud.token); },
      error_callback:e=>{ const p=cloud.pending; cloud.pending=null; if(p) p.rej(new Error((e&&e.type)||"popup")); }
    });
  };
  document.head.appendChild(s);
}
function getToken(){   // 必須在點擊當下呼叫，瀏覽器才不會擋掉授權視窗
  if(cloud.token && Date.now() < cloud.exp-60000) return Promise.resolve(cloud.token);
  if(!cloud.client) return Promise.reject(new Error("notready"));
  return new Promise((res,rej)=>{ cloud.pending={res,rej}; cloud.client.requestAccessToken({prompt: data.meta.cloudConnected ? "" : "consent"}); });
}
async function gfetch(url, opts){
  const t=await getToken();
  const r=await fetch(url, Object.assign({}, opts, {headers:Object.assign({}, (opts&&opts.headers)||{}, {Authorization:"Bearer "+t})}));
  if(r.status===401){ cloud.token=""; throw new Error("auth"); }
  if(!r.ok) throw new Error("http"+r.status);
  return r;
}
async function findCloudFile(){
  const q=encodeURIComponent("name='"+CLOUD_FILE+"' and trashed=false");
  const r=await gfetch(DRIVE+"?q="+q+"&spaces=drive&orderBy=modifiedTime%20desc&fields=files(id,modifiedTime)");
  const j=await r.json(); return (j.files&&j.files[0])||null;
}
function cloudError(e){
  const m=e&&e.message;
  if(m==="notready") toast("Google 登入元件還沒載入，請確認有網路，過幾秒再按一次");
  else if(m==="popup_closed"||m==="access_denied") toast("已取消，沒有變更");
  else if(m==="popup_failed_to_open") toast("授權視窗被擋住了，請允許這個網站開啟彈出式視窗");
  else if(m==="auth") toast("Google 授權過期了，請再按一次");
  else toast("連不上 Google Drive，請確認網路後再試一次");
}
async function cloudBackup(){
  if(ui.cloudBusy) return;
  const tokenP=getToken();          // 先在點擊當下要授權
  ui.cloudBusy="backup"; keepScroll(render);
  try{
    await tokenP;
    const body=JSON.stringify(backupPayload());
    const f=await findCloudFile();
    if(new Blob([body]).size > 4.5e6){ await resumableUpload(f&&f.id, body); }   // 照片多、超過 5MB 時要分段上傳
    else if(f){
      await gfetch("https://www.googleapis.com/upload/drive/v3/files/"+f.id+"?uploadType=media", {method:"PATCH", headers:{"Content-Type":"application/json"}, body});
    } else {
      const fd=new FormData();
      fd.append("metadata", new Blob([JSON.stringify({name:CLOUD_FILE, mimeType:"application/json"})], {type:"application/json"}));
      fd.append("file", new Blob([body], {type:"application/json"}));
      await gfetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart", {method:"POST", body:fd});
    }
    data.meta.cloudConnected=true; data.meta.lastCloud=new Date().toISOString(); markBackup();
    toast("已備份到你的 Google Drive");
  }catch(e){ cloudError(e); }
  ui.cloudBusy=null; keepScroll(render);
}
// 大檔上傳：先跟 Drive 要一個上傳網址，再把整個檔案送過去（一般上傳上限 5MB）
async function resumableUpload(id, body){
  const url="https://www.googleapis.com/upload/drive/v3/files"+(id?"/"+id:"")+"?uploadType=resumable";
  const r=await gfetch(url, {method:id?"PATCH":"POST", headers:{"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":"application/json"},
    body: id ? "{}" : JSON.stringify({name:CLOUD_FILE, mimeType:"application/json"})});
  const loc=r.headers.get("Location"); if(!loc) throw new Error("http0");
  const r2=await fetch(loc, {method:"PUT", headers:{"Content-Type":"application/json"}, body});
  if(!r2.ok) throw new Error("http"+r2.status);
}
async function cloudRestore(){
  if(ui.cloudBusy) return;

  try{
    await tokenP;

    if(!f){ toast("你的 Google Drive 裡還沒有名片夾的備份"); }

      const r=await gfetch(DRIVE+"/"+f.id+"?alt=media");
      let d=null; try{ d=await r.json(); }catch(e){}

  ui.cloudBusy=null; keepScroll(render);
}
const when = iso => { if(!iso) return ""; const d=new Date(iso); return isNaN(d) ? "" : d.toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}); };
function cloudPending(){   // 有變更還沒備份，而且距離上次雲端備份超過三天

/* ---------- 名片文字辨識（OCR，全部在手機上進行） ----------
   兩種引擎可選（設定頁）：
   ・高準確度（預設）：PaddleOCR PP-OCRv5 行動版，程式在 paddle.js，約 25MB。照片、底紋、深色、直式都認得出來。
   ・輕量：Tesseract.js，以下說明。
   輕量引擎：Tesseract.js 5.1.1，第一次使用時從 jsDelivr 下載程式與精簡版語言資料（繁中 1.7MB＋英文 3MB），之後存在手機上。
   做法：同一張照片辨識兩次再合併——大圖（長邊 1500）讀小字、小圖（長邊 850，稀疏文字模式）讀大字，
   同一個位置取信心比較高的那一行。Tesseract 不擅長特別大的字，而名片上的姓名通常最大，所以需要第二次。
   拆欄位規則在 cardparse.js。辨識結果只填進還空著的欄位，並標上「請確認」。 */
const OCR_LIB = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
const ocr = {worker:null, langs:"", seq:0, idle:null, lib:null};
function ocrLangs(){ const o=data.settings.ocr; return ["chi_tra","eng"].concat(o.jpn?["jpn"]:[], o.chi_sim?["chi_sim"]:[]); }
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(ocr.lib) return ocr.lib;
  ocr.lib=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=OCR_LIB; s.async=true;
    s.onload=()=>res(window.Tesseract); s.onerror=()=>{ ocr.lib=null; rej(new Error("lib")); }; document.head.appendChild(s); });
  return ocr.lib;
}
async function getWorker(onProgress){
  const langs=ocrLangs(), key=langs.join("+");
  if(ocr.worker && ocr.langs===key) return ocr.worker;
  if(ocr.worker){ try{ await ocr.worker.terminate(); }catch(e){} ocr.worker=null; }
  const T=await loadTesseract();
  ocr.worker=await T.createWorker(langs, 1, {logger:m=>onProgress && onProgress(m)});
  ocr.langs=key; return ocr.worker;
}
function ocrIdle(){ clearTimeout(ocr.idle); ocr.idle=setTimeout(()=>{ if(ocr.worker && !ui.ocr){ ocr.worker.terminate().catch(()=>{}); ocr.worker=null; } }, 120000); }
function ocrCancel(){
  ocr.seq++;
  if(ui.ocr && ui.ocr.status!=="error" && ocr.worker){ ocr.worker.terminate().catch(()=>{}); ocr.worker=null; }   // 正在跑的才終止
  ui.ocr=null;
}
// 給輕量引擎（Tesseract）的前處理：縮放、灰階、深色底反相、區域自適應黑白化（Bradley 法）、清掉邊緣。
// 實測：只拉對比時，有底紋的證件、直式名片、有光線漸層的照片幾乎認不出來（約 47%）；改成區域黑白化後約 98%。
async function prepImage(file, maxSide){
  const bmp=await createImageBitmap(file, {imageOrientation:"from-image"});
  const r=Math.min(1, maxSide/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas"), W=c.width=Math.round(bmp.width*r), H=c.height=Math.round(bmp.height*r);
  const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(bmp,0,0,W,H); bmp.close&&bmp.close();
  const im=g.getImageData(0,0,W,H), d=im.data, n=W*H, y=new Float32Array(n); let sum=0;
  for(let i=0;i<n;i++){ y[i]=(d[i*4]*299+d[i*4+1]*587+d[i*4+2]*114)/1000; sum+=y[i]; }
  if(sum/n<110) for(let i=0;i<n;i++) y[i]=255-y[i];          // 深色名片、淺色字：先反過來
  // 積分圖算每個點周圍的平均亮度；比周圍暗 15% 以上就是字
  const I=new Float64Array((W+1)*(H+1));
  for(let yy=0;yy<H;yy++){ let row=0; for(let x=0;x<W;x++){ row+=y[yy*W+x]; I[(yy+1)*(W+1)+x+1]=I[yy*(W+1)+x+1]+row; } }
  const half=Math.max(7, Math.round(Math.max(W,H)/48)), m=Math.round(Math.min(W,H)*0.015);
  for(let yy=0;yy<H;yy++){
    const y0=Math.max(0,yy-half), y1=Math.min(H,yy+half+1);
    for(let x=0;x<W;x++){
      const x0=Math.max(0,x-half), x1=Math.min(W,x+half+1), cnt=(y1-y0)*(x1-x0);
      const mean=(I[y1*(W+1)+x1]-I[y0*(W+1)+x1]-I[y1*(W+1)+x0]+I[y0*(W+1)+x0])/cnt;
      const edge=x<m||yy<m||x>=W-m||yy>=H-m;               // 照片邊緣常有一條桌面或陰影，Tesseract 會被它干擾
      const v=(!edge && y[yy*W+x]<mean*0.85)?0:255, k=(yy*W+x)*4;
      d[k]=d[k+1]=d[k+2]=v;
    }
  }
  g.putImageData(im,0,0); return c;
}
function mergeLines(A, B, k, W, H){
  const a=A.map(l=>({text:l.text.trim(), conf:l.confidence, x0:l.bbox.x0, y0:l.bbox.y0, x1:l.bbox.x1, y1:l.bbox.y1}));
  const b=B.map(l=>({text:l.text.trim(), conf:l.confidence, x0:l.bbox.x0*k, y0:l.bbox.y0*k, x1:l.bbox.x1*k, y1:l.bbox.y1*k}));
  const ov=(p,q)=>{ const iy=Math.max(0,Math.min(p.y1,q.y1)-Math.max(p.y0,q.y0)), ix=Math.max(0,Math.min(p.x1,q.x1)-Math.max(p.x0,q.x0));
    return (ix*iy)/Math.max(1,Math.min((p.x1-p.x0)*(p.y1-p.y0),(q.x1-q.x0)*(q.y1-q.y0))); };
  const out=a.slice();
  for(const q of b){ if(!q.text) continue; const i=out.findIndex(p=>ov(p,q)>0.5); if(i<0) out.push(q); else if(q.conf>out[i].conf+5) out[i]=q; }
  return out.filter(l=>l.text).sort((p,q)=>p.y0-q.y0||p.x0-q.x0).map(l=>({text:l.text, h:l.y1-l.y0, conf:Math.round(l.conf),
    box:{x:l.x0/W, y:l.y0/H, w:(l.x1-l.x0)/W, h:(l.y1-l.y0)/H}}));
}
/* ---------- 文字卡整理（乙方案） ----------

function startOCR(side, file){
  const o=data.settings.ocr;
  const have = o.engine==="paddle" ? o.paddleReady : (o.ready || o.consented);
  if(!have){ ui.ocrAsk={side, file}; render(); window.scrollTo(0,0); return; }
  runOCR(side, file);
}
async function fileCanvas(file, maxSide){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const r=Math.min(1,maxSide/Math.max(bmp.width,bmp.height)), c=document.createElement("canvas");
  c.width=Math.round(bmp.width*r); c.height=Math.round(bmp.height*r); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); bmp.close&&bmp.close();
  return c;
}
async function paddleLines(file, side, alive){
  const label=side==="back"?"背面":"正面", o=data.settings.ocr;
  if(!o.paddleReady || !(await PaddleOCR.isReady())){
    setOcrStatus("下載高準確度辨識資料 0%（只有第一次）");
    await downloadPaddle(p=>{ if(alive()) setOcrStatus("下載高準確度辨識資料 "+Math.round(p*100)+"%（只有第一次）"); });
  }
  if(!alive()) return null;
  setOcrStatus("載入辨識引擎…"); await PaddleOCR.init();
  if(!alive()) return null;
  setOcrStatus("辨識"+label+"文字…");
  const c=await fileCanvas(file, 1500);
  return PaddleOCR.recognize(c, (i,n)=>{ if(alive()) setOcrStatus("辨識"+label+"文字…（"+i+" / "+n+"）"); });
}
function setOcrStatus(text){ if(!ui.ocr) return; ui.ocr.status=text; const box=document.getElementById("ocrbox"); if(box) box.outerHTML=ocrBox(); }
async function runOCR(side, file){
  const my=++ocr.seq, label=side==="back"?"背面":"正面";
  ui.ocr={side, status:"準備辨識"+label+"…"}; render(); window.scrollTo(0,0);
  const alive=()=>my===ocr.seq;
  try{
   let lines;
   if(data.settings.ocr.engine==="paddle"){
    lines=await paddleLines(file, side, alive);
    if(!lines || !alive()) return;
   } else {
    const w=await getWorker(m=>{
      if(!alive()) return;
      if(m.status==="loading language traineddata") setOcrStatus("下載辨識資料 "+Math.round((m.progress||0)*100)+"%（只有第一次）");
      else if(m.status==="loading tesseract core") setOcrStatus("載入辨識引擎…");
    });
    if(!alive()) return;
    const big=await prepImage(file,1500), small=await prepImage(file,850);
    if(!alive()) return;
    setOcrStatus("辨識"+label+"文字…");
    await w.setParameters({preserve_interword_spaces:"1", tessedit_pageseg_mode:"3"});
    const A=(await w.recognize(big)).data.lines; if(!alive()) return;
    await w.setParameters({preserve_interword_spaces:"1", tessedit_pageseg_mode:"11"});
    const B=(await w.recognize(small)).data.lines; if(!alive()) return;

   }
    if(!ui.adding) return;            // 使用者已經離開表單
    syncDraft();

    const parsed=CardParse.parse(lines,{side, learn:data.learn});
    if(!parsed.tokens.length){ keepScroll(render); toast("沒有認出可用的文字，可以改用貼上文字或手動輸入"); return; }
    addTokens(side, parsed.tokens); setRaw(label, lines.map(l=>l.text).join("\n"));
    ui.rv.side=side;
    const nL=parsed.tokens.filter(t=>t.learned).length;

    if(ocr.worker){ ocr.worker.terminate().catch(()=>{}); ocr.worker=null; }
    const o=data.settings.ocr, first=o.engine==="paddle"?!o.paddleReady:!o.ready;

    syncDraft(); keepScroll(render);

/* ---------- 電子名片 ----------
   QR code 放的是一個網址：https://…/bizcard/#c=<名片資料>。
   名片資料放在 # 後面，瀏覽器不會把這段送到伺服器，GitHub 也看不到；對方的手機打開網頁後，在自己手機上把名片組出來。
   缺點：資料就在網址裡，改了名片之後，之前給出去的 QR code 還是舊內容。 */
const b64u = {
  enc: str => { const bytes=new TextEncoder().encode(str); let bin=""; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); },
  dec: s => { s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c=>c.charCodeAt(0))); }
};
function stylePool(){ const s=data.settings; return data.active==="personal" ? s.stylePersonal : [s.styleWork]; }
function drawStyle(){   // 抽樣式：三種以上時，不連續兩次一樣（只有兩種就真的隨機，免得變成輪流）
  const pool=stylePool(), opts=pool.length>2 ? pool.filter(k=>k!==ui.drawn) : pool;
  ui.drawn=opts[Math.floor(Math.random()*opts.length)] || "classic"; return ui.drawn;
}
// 分享出去的連結加上 openExternalBrowser=1：在 LINE 裡點開時會改用手機瀏覽器，下載聯絡人、存圖片才不會失敗
const EXT = "?openExternalBrowser=1";
function ecardUrl(p, style, share){
  const v=visible(p), s=data.settings;
  const o={v:1, n:v.name, t:v.title, o:v.org, g:v.tagline, p:v.phone, e:v.email, l:v.line, w:v.web, a:p.address, i:p.intro,
    k:(p.links||[]).map(x=>[x.label,x.url]), c:colorKey(), f:s.fonts.name, ft:s.fonts.cardText!=="sans"?s.fonts.cardText:"", s:style&&style!=="classic"?style:""};
  Object.keys(o).forEach(k=>{ if(o[k]==="" || (Array.isArray(o[k]) && !o[k].length)) delete o[k]; });
  return location.origin + location.pathname.replace(/index\.html$/,"") + (share?EXT:"") + "#c=" + b64u.enc(JSON.stringify(o));
}
function readEcard(hash){
  try{
    const o=JSON.parse(b64u.dec(hash.slice(3)));
    const p=cleanMe({name:o.n,title:o.t,org:o.o,tagline:o.g,phone:o.p,email:o.e,line:o.l,web:o.w,address:o.a,intro:o.i,
      links:(Array.isArray(o.k)?o.k:[]).map(x=>({label:Array.isArray(x)?x[0]:"", url:Array.isArray(x)?x[1]:""}))});
    p.web=p.web?safeUrl(p.web):"";
    return {p, color:CARD_COLORS[o.c]?o.c:"green", font:FONTS[o.f]?o.f:"serif", textFont:FONTS[o.ft]?o.ft:"sans", style:ESTYLES[o.s]?o.s:"classic"};
  }catch(e){ return null; }
}
const lineUrl = id => /^@/.test(id) ? "https://line.me/R/ti/p/"+encodeURIComponent(id) : "https://line.me/ti/p/~"+encodeURIComponent(id);
const isCJK = t => /[㐀-鿿]/.test(t||"");
function sealText(name){

  if(isCJK(name)) return {t:[...name.replace(/\s/g,"")].slice(0,4).join(""), lat:false};

}
// 插畫樣式的背景：柔和色塊＋兩條細線＋一片葉子；畫成圖片時用同一組路徑

  blob2:"M-40 150 C10 110 80 120 110 170 C140 220 100 270 40 270 C-10 270 -60 220 -40 150Z",
  line1:"M40 236 C110 196 180 266 250 226 S360 206 400 236",
  line2:"M40 248 C110 208 180 278 250 238 S360 218 400 248",
  deco:["M138 152 C126 112 158 80 198 74 C204 114 178 148 138 152Z","M138 152 C156 126 176 102 198 74","M150 133 l-10 -8","M162 118 l-11 -7","M174 102 l-10 -8","M138 152 l-9 12"]

function artHTML(p, st){
  const nm=esc(p.name||""), org=esc(p.org||""), tt=esc(p.title||""), tg=esc(p.tagline||"");
  if(st==="paper"){
    const ct=[p.phone,p.email].filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join("");
    return '<div class="art paper"><div class="pp"><div class="pp-top"><span>'+org+'</span><span class="pp-seal" aria-hidden="true">'+esc([...(p.name||"·")][0])+'</span></div>'
      + '<div><div class="pp-nm">'+nm+'</div><div class="pp-tt">'+tt+'</div>'+(tg?'<div class="pp-tg">'+tg+'</div>':'')+'</div>'
      + (ct?'<div class="pp-ct">'+ct+'</div>':'<div></div>')+'</div></div>';
  }
  if(st==="illu"){
    const svg='<svg class="il-bg" viewBox="0 0 390 260" aria-hidden="true">'
      + '<path d="'+ILLU.blob1+'" fill="var(--acc)" opacity=".2"/><path d="'+ILLU.blob2+'" fill="#E8C98A" opacity=".45"/>'
      + '<circle cx="300" cy="190" r="30" fill="#F6E7C8"/>'
      + '<path d="'+ILLU.line1+'" fill="none" stroke="var(--acc)" stroke-width="1.2" opacity=".5"/><path d="'+ILLU.line2+'" fill="none" stroke="var(--acc)" stroke-width="1.2" opacity=".25"/>'
      + '<g fill="none" stroke="var(--acc)" stroke-width="1.4" stroke-linecap="round" opacity=".65">'+ILLU.deco.map(d=>'<path d="'+d+'"/>').join("")+'</g></svg>';
    return '<div class="art illu">'+svg+'<div class="il-txt">'+(org?'<div class="il-org">'+org+'</div>':'')+'<div class="il-nm">'+nm+'</div><div class="il-tt">'+tt+'</div>'
      + (tg?'<p class="il-q">'+tg+'</p>':'')+'</div></div>';
  }
  // 直排
  const vc=(t,gap)=>'<span class="vc" style="gap:'+gap+'">'+[...t].map(c=>'<i>'+esc(c)+'</i>').join("")+'</span>';
  const len=t=>[...(t||"")].length||1;
  const fs=Math.min(19, 74/(len(p.name)*1.2)), os=Math.min(3.4, 68/(len(p.org)*1.3)), ts=Math.min(3.2, 44/(len(p.tagline)*1.25));
  const seal=sealText(p.name), sc=[...seal.t], sfs=seal.lat?6:(sc.length<=1?8:sc.length<=2?5.4:4.6);
  const sealIn = seal.lat ? '<span>'+esc(seal.t)+'</span>' : [sc.slice(0,2),sc.slice(2,4)].filter(c=>c.length).map(c=>vc(c.join(""),"0")).join("");
  return '<div class="art vert"><div class="vt-nm" style="font-size:'+fs.toFixed(1)+'cqw">'+vc(p.name||"",(fs*.18).toFixed(1)+'cqw')+'</div>'
    + (p.title?'<div class="vt-tt">'+vc(p.title,"1.6cqw")+'</div>':'')
    + (p.org?'<div class="vt-org" style="font-size:'+os.toFixed(2)+'cqw">'+vc(p.org,(os*.28).toFixed(2)+'cqw')+'</div>':'')
    + (p.tagline?'<div class="vt-tg" style="font-size:'+ts.toFixed(2)+'cqw">'+vc(p.tagline,(ts*.18).toFixed(2)+'cqw')+'</div>':'')
    + '<div class="vt-seal" aria-hidden="true" style="font-size:'+sfs+'cqw">'+sealIn+'</div></div>';
}

/* ---------- 電子名片存成圖片：對方抽到哪一款就畫哪一款；不印電話，只放連回電子名片的 QR code ---------- */
function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function fitFont(g, text, weight, size, family, maxW){
  let f=size; g.font=weight+" "+f+"px "+family;
  while(f>14 && g.measureText(text).width>maxW){ f-=2; g.font=weight+" "+f+"px "+family; }
  return f;
}
function spaced(g, text, x, y, sp, align){   // 加字距的橫排文字
  const chars=[...text], w=chars.reduce((a,c)=>a+g.measureText(c).width,0)+sp*(chars.length-1);
  let cx = align==="center" ? x-w/2 : align==="right" ? x-w : x;
  const keep=g.textAlign; g.textAlign="left";
  chars.forEach(c=>{ g.fillText(c,cx,y); cx+=g.measureText(c).width+sp; });
  g.textAlign=keep; return w;
}
function vtext(g, text, x, y, size, gap){   // 直排：一個字一個字往下畫
  g.textAlign="center"; g.textBaseline="top";
  [...text].forEach((c,i)=>g.fillText(c, x, y+i*(size+gap)));
  g.textBaseline="alphabetic";
}
async function drawEcardImage(card){
  const p=card.p, st=card.style||"classic", acc=(CARD_COLORS[card.color]||CARD_COLORS.green).c;
  const W=1080, H=1440, cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const g=cv.getContext("2d");
  // 名字跟著「名字」字體、其他文字跟著「名片內文」字體，和使用者在設定裡選的一樣
  const NAMEF=(FONTS[card.font]||FONTS.serif).stack, SERIF=NAMEF, SANS=(FONTS[card.textFont]||FONTS.sans).stack;
  const all=[p.name,p.title,p.org,p.tagline,"掃描存下我的聯絡方式・隨身名片夾"].join("");
  try{ await Promise.race([Promise.all(['700 80px '+NAMEF.split(",")[0],'400 30px '+SANS.split(",")[0],'500 30px '+SANS.split(",")[0],'400 30px "Noto Sans TC"'].map(f=>document.fonts.load(f, all))), new Promise(r=>setTimeout(r,3000))]); }catch(e){}
  const name=p.name||"", org=p.org||"", title=p.title||"", tg=p.tagline||"";
  if(st==="paper"){
    g.fillStyle="#EFEBE3"; g.fillRect(0,0,W,H);
    const img=g.getImageData(0,0,W,H), d=img.data;   // 紙紋：細小的明暗雜點
    for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*14; d[i]+=n; d[i+1]+=n; d[i+2]+=n*.9; }
    g.putImageData(img,0,0);
    g.save(); g.translate(W/2, 470); g.rotate(-2*Math.PI/180);
    const cw=900, ch=534, x=-cw/2, y=-ch/2;
    g.shadowColor="rgba(60,50,35,.35)"; g.shadowBlur=50; g.shadowOffsetY=26;
    g.fillStyle="#FBF9F4"; rrect(g,x,y,cw,ch,10); g.fill(); g.shadowColor="transparent";
    g.fillStyle="#6E7A6F"; g.font="400 28px "+SANS; fitFont(g,org,"400",28,SANS,cw-200); spaced(g,org,x+60,y+80,4,"left");
    g.strokeStyle=acc; g.lineWidth=3; g.beginPath(); g.arc(x+cw-82,y+70,26,0,Math.PI*2); g.stroke();
    g.fillStyle=acc; g.font="500 28px "+SERIF; g.textAlign="center"; g.fillText([...(name||"·")][0], x+cw-82, y+80); g.textAlign="left";
    g.fillStyle="#23312C"; const f=fitFont(g,name,"700",86,SERIF,cw-160); spaced(g,name,x+60,y+300,f*.2,"left");
    g.fillStyle=acc; g.font="400 32px "+SANS; spaced(g,title,x+62,y+356,9,"left");
    if(tg){ g.fillStyle="#6E6A60"; fitFont(g,tg,"400",28,SANS,cw-120); g.fillText(tg,x+62,y+404); }
    g.restore();
  } else if(st==="illu"){
    g.fillStyle="#EEF2EE"; g.fillRect(0,0,W,H);
    g.save(); g.translate(72,-40); g.scale(2.4, 2.4);
    g.fillStyle=acc; g.globalAlpha=.2; g.fill(new Path2D(ILLU.blob1));
    g.fillStyle="#E8C98A"; g.globalAlpha=.45; g.fill(new Path2D(ILLU.blob2));
    g.globalAlpha=1; g.fillStyle="#F6E7C8"; g.beginPath(); g.arc(300,190,30,0,Math.PI*2); g.fill();
    g.strokeStyle=acc; g.lineWidth=1.2; g.globalAlpha=.5; g.stroke(new Path2D(ILLU.line1)); g.globalAlpha=.25; g.stroke(new Path2D(ILLU.line2));
    g.globalAlpha=.65; g.lineWidth=1.4; g.lineCap="round"; ILLU.deco.forEach(d=>g.stroke(new Path2D(d)));
    g.restore(); g.globalAlpha=1;
    let y=620;
    if(org){ g.fillStyle="#587569"; fitFont(g,org,"400",34,SANS,900); spaced(g,org,90,y,8,"left"); y+=30; }
    g.fillStyle="#263430"; const f=fitFont(g,name,"700",120,SERIF,880); spaced(g,name,86,y+f*.95,f*.14,"left"); y+=f*1.15;
    g.fillStyle=acc; g.font="400 38px "+SANS; spaced(g,title,90,y+30,11,"left"); y+=60;
    if(tg){ g.fillStyle="#E8C98A"; g.fillRect(90,y,4,56); g.fillStyle="#4A5B55"; fitFont(g,tg,"400",36,SERIF,840); g.fillText(tg,122,y+42); }
  } else if(st==="vert"){
    g.fillStyle="#F7F2E7"; g.fillRect(0,0,W,H);
    g.strokeStyle="#D9CFBC"; g.lineWidth=2; g.strokeRect(44,44,W-88,H-120);
    const n=[...name].length||1, fs=Math.min(150, 640/(n*1.15));
    g.fillStyle="#22201C"; g.font="700 "+fs+"px "+SERIF; vtext(g,name,W-150-fs/2+60,130,fs,fs*.15);
    let x=W-150-fs-40;
    if(title){ g.fillStyle=acc; g.font="500 44px "+SERIF; vtext(g,title,x,150,44,20); x-=90; }
    if(org){ const len=[...org].length, os=Math.min(32, 680/(len*1.3)); g.fillStyle="#776D5F"; g.font="400 "+os+"px "+SANS; vtext(g,org,x,150,os,os*.3); }
    if(tg){ const len=[...tg].length, ts=Math.min(30, 560/(len*1.25)); g.fillStyle="#776D5F"; g.font="400 "+ts+"px "+SANS; vtext(g,tg,140,130,ts,ts*.2); }
    const seal=sealText(name); g.save(); g.translate(190,800); g.rotate(-3*Math.PI/180);
    g.fillStyle="#B5402F"; rrect(g,-70,-70,140,140,6); g.fill(); g.strokeStyle="#F7F2E7"; g.lineWidth=4; rrect(g,-60,-60,120,120,4); g.stroke();
    g.fillStyle="#F7F2E7"; g.textAlign="center"; g.textBaseline="middle";
    const ch=[...seal.t];
    if(seal.lat){ g.font="700 56px "+SERIF; g.fillText(seal.t,0,4); }
    else if(ch.length<=1){ g.font="700 80px "+SERIF; g.fillText(ch[0]||"",0,4); }
    else { const cols=[ch.slice(0,2), ch.slice(2,4)].filter(c=>c.length), sz=ch.length<=2?54:44;   // 印章：右欄先、由上而下
      g.font="700 "+sz+"px "+SERIF;
      cols.forEach((col,ci)=>{ const cx = cols.length===1?0:(ci===0?sz*.55:-sz*.55); col.forEach((c,ri)=>g.fillText(c,cx,(ri-(col.length-1)/2)*sz*1.05)); }); }
    g.restore(); g.textBaseline="alphabetic"; g.textAlign="left";
  } else {
    const pal=CARD_COLORS[card.color]||CARD_COLORS.green;
    g.fillStyle=pal.L.bg; g.fillRect(0,0,W,H);
    const x=90, y=170, cw=900, ch=534;
    g.shadowColor="rgba(20,40,35,.25)"; g.shadowBlur=40; g.shadowOffsetY=18;
    g.fillStyle=pal.c; rrect(g,x,y,cw,ch,40); g.fill(); g.shadowColor="transparent";
    g.save(); rrect(g,x,y,cw,ch,40); g.clip(); g.fillStyle="rgba(255,255,255,.07)"; g.beginPath(); g.arc(x+cw+20,y-20,200,0,Math.PI*2); g.fill(); g.restore();
    g.fillStyle="rgba(255,255,255,.72)"; fitFont(g,org,"400",30,SANS,cw-160); spaced(g,org,x+58,y+86,3,"left");
    g.fillStyle="#E8C98A"; g.font="400 24px "+SANS; g.fillText("●", x+cw-82, y+84);
    g.fillStyle="#F4F1EA"; const f=fitFont(g,name,"700",86,NAMEF,cw-120); spaced(g,name,x+58,y+330,f*.1,"left");
    g.fillStyle="#E8C98A"; g.font="400 34px "+SANS; spaced(g,title,x+60,y+392,6,"left");
    if(tg){ g.fillStyle="rgba(255,255,255,.74)"; fitFont(g,tg,"400",30,SANS,cw-120); g.fillText(tg,x+60,y+446); }
  }
  // QR code：連回這張電子名片
  const qs=380, qx=W/2-qs/2, qy=960;
  g.fillStyle="#FFFFFF"; g.shadowColor="rgba(0,0,0,.08)"; g.shadowBlur=24; rrect(g,qx,qy,qs,qs,28); g.fill(); g.shadowColor="transparent";
  try{
    if(qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
    const q=qrcode(0,"M"); q.addData(location.href,"Byte"); q.make();
    const n=q.getModuleCount(), m=(qs-56)/n; g.fillStyle="#1F3530";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) g.fillRect(Math.floor(qx+28+c*m), Math.floor(qy+28+r*m), Math.ceil(m), Math.ceil(m));
  }catch(e){}
  g.fillStyle = st==="classic" ? (CARD_COLORS[card.color]||CARD_COLORS.green).L.muted : "#776D5F";
  g.font="400 30px "+SANS; g.textAlign="center"; g.fillText("掃描存下我的聯絡方式", W/2, qy+qs+50);
  g.font="400 22px "+SANS; g.globalAlpha=.6; g.fillText("隨身名片夾", W/2, H-20); g.globalAlpha=1; g.textAlign="left";
  return cv;
}
async function saveEcardImage(btn){
  const card=ui.ecardCard; if(!card) return;
  if(btn){ btn.disabled=true; btn.textContent="正在畫…"; }
  try{
    const cv=await drawEcardImage(card);
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    const fn=(card.p.name||"電子名片")+"的名片.png";
    const file=new File([blob], fn, {type:"image/png"});
    let shared=false;
    try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:fn}); shared=true; } }
    catch(e){ if(e && e.name==="AbortError") shared=true; }
    if(!shared){
      const url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download=fn; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 5000); toast("已下載圖片");
    }
  }catch(e){ toast("圖片沒有畫成功，請再試一次"); }
  if(btn){ btn.disabled=false; btn.textContent="存成圖片"; }
}

const CAN_SCAN = ("BarcodeDetector" in window) && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const scan={stream:null, timer:null};
async function startScan(){
  let det;
  try{ det=new BarcodeDetector({formats:["qr_code"]}); }catch(e){ toast("這個瀏覽器不支援掃描 QR code"); return; }
  try{ scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
  catch(e){ toast(e && e.name==="NotAllowedError" ? "相機權限被拒絕了。請到 Chrome 的網站設定，允許這個網站使用相機。" : "打不開相機，請再試一次"); return; }
  const v=document.getElementById("scanVideo");
  v.srcObject=scan.stream; document.getElementById("scanner").hidden=false; document.body.style.overflow="hidden";
  try{ await v.play(); }catch(e){}
  const tick=async()=>{
    if(!scan.stream) return;
    try{ const r=await det.detect(v); if(r && r.length && r[0].rawValue){ const raw=r[0].rawValue; stopScan(); onScanned(raw); return; } }catch(e){}
    scan.timer=setTimeout(tick, 250);
  };
  tick();
}
function stopScan(){
  clearTimeout(scan.timer);
  if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null; }
  document.getElementById("scanVideo").srcObject=null;
  document.getElementById("scanner").hidden=true; document.body.style.overflow="";
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden && scan.stream) stopScan(); });

// 讀懂 QR code 裡的名片：vCard（大多數數位名片）與 MECARD（部分手機產生的格式）
function parseContact(raw){
  const t=String(raw).trim(), o={};
  const un=s=>s.replace(/\\n/gi,"\n").replace(/\\([,;:\\])/g,"$1").trim();
  const joinName=(fam,giv)=>{ fam=(fam||"").trim(); giv=(giv||"").trim(); return /^[\x00-\x7F]*$/.test(fam+giv) ? [giv,fam].filter(Boolean).join(" ") : fam+giv; };
  if(/^BEGIN:VCARD/i.test(t)){
    const lines=t.replace(/\r?\n[ \t]/g,"").split(/\r?\n/);
    for(const ln of lines){
      const i=ln.indexOf(":"); if(i<0) continue;
      const key=ln.slice(0,i).split(";")[0].replace(/^item\d+\./i,"").toUpperCase(), v=ln.slice(i+1);
      if(key==="FN") o.name=un(v);
      else if(key==="N" && !o.name){ const p=v.split(";"); o.name=joinName(un(p[0]||""),un(p[1]||"")); }
      else if(key==="ORG") o.org=un(v.split(";")[0]);
      else if(key==="TITLE") o.title=un(v);
      else if(key==="TEL" && /FAX/i.test(ln.slice(0,i))){ if(!o.fax) o.fax=un(v); }
      else if(key==="TEL"){ const isWork=/TYPE=[^:;]*(WORK|VOICE)/i.test(ln.slice(0,i)) && !/CELL/i.test(ln.slice(0,i));
        if(isWork && !o.tel) o.tel=un(v); else if(!o.phone) o.phone=un(v); else if(!o.tel) o.tel=un(v); }
      else if(key==="ADR" && !o.address) o.address=un(v.split(";").filter(Boolean).join(" "));
      else if(key==="EMAIL" && !o.email) o.email=un(v);
      else if(key==="URL" && !o.web) o.web=un(v);
      else if(key==="NOTE") o.noteRaw=un(v);
    }
  } else if(/^MECARD:/i.test(t)){
    t.slice(7).split(/(?<!\\);/).forEach(part=>{
      const i=part.indexOf(":"); if(i<0) return;
      const k=part.slice(0,i).toUpperCase(), v=un(part.slice(i+1));
      if(k==="N"){ const p=v.split(","); o.name=joinName(p[0],p[1]); }
      else if(k==="TEL" && !o.phone) o.phone=v;
      else if(k==="EMAIL" && !o.email) o.email=v;
      else if(k==="ORG") o.org=v;
      else if(k==="URL") o.web=v;
      else if(k==="NOTE") o.noteRaw=v;
    });
  } else return null;
  if(o.noteRaw){
    const m=o.noteRaw.match(/LINE[:：]\s*([^\s\/]+)/i); if(m) o.line=m[1];
    const rest=o.noteRaw.replace(/LINE[:：]\s*[^\s\/]+\s*\/?\s*/i,"").trim(); if(rest) o.note=rest;
    delete o.noteRaw;
  }
  Object.keys(o).forEach(k=>o[k]=str(o[k]));
  return o;
}
function onScanned(raw){
  const c=parseContact(raw);
  if(c && c.name){ ui.draft=c; toast("讀到「"+c.name+"」的名片，確認後按存入"); }
  else { ui.draft={note:str(raw)}; toast("這不是名片格式的 QR code，內容先放在備註裡"); }
  ui.tab="book"; ui.adding=true; ui.editId=null; ui.draftPhoto=""; ui.draftBack=""; render(); window.scrollTo(0,0);
}
