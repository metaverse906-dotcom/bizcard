  else if(a==="askDel"){ ui.confirmId=id; rerenderCards(); }
  else if(a==="noDel"){ ui.confirmId=null; rerenderCards(); }
  else if(a==="del"){ data.cards=data.cards.filter(c=>c.id!==id); ui.openId=null; ui.confirmId=null; save(); keepScroll(render); toast("已刪除"); }
  else if(a==="set"){ data.settings[el.dataset.group]=el.dataset.key; save(); applySettings(); keepScroll(render); }
  else if(a==="font"){ data.settings.fonts[el.dataset.role]=el.dataset.key; save(); applySettings(); keepScroll(render); }
  else if(a==="exportText"){
    markBackup(); deliver("名片夾備份-文字-"+today()+".json", JSON.stringify(textOnly(backupPayload())), "application/json");
  }
  else if(a==="shareApp"){
    const url=APP_URL()+EXT, text="一個存名片、遞名片的小工具，資料只存在自己手機裡：";
    if(navigator.share){ navigator.share({title:"隨身名片夾", text, url}).catch(()=>{}); } else copy(url);
  }
  else if(a==="supportOk"){ data.meta.supportShown=true; save({quiet:true}); keepScroll(render); }
  else if(a==="supportGo"){ data.meta.supportShown=true; save({quiet:true}); ui.tab="set"; ui.setPage="about"; render(); window.scrollTo(0,0); }
  else if(a==="exportJson"){
    markBackup(); if(ui.tab==="book") keepScroll(render); deliver("名片夾備份-"+today()+".json", JSON.stringify(backupPayload()), "application/json");
  }
  else if(a==="cloudBackup"){ cloudBackup(); }
  else if(a==="cloudRestore"){ cloudRestore(); }
  else if(a==="goSettings"){ ui.tab="set"; ui.setPage="backup"; render(); window.scrollTo(0,0); }
  else if(a==="exportVcf"){
    const real=data.cards.filter(c=>!c.sample);
    if(!real.length){ toast("名片夾裡還沒有自己存的名片"); return; }
    deliver("名片夾聯絡人-"+today()+".vcf", real.map(vcard).join("\r\n")+"\r\n", "text/vcard");
  }
  else if(a==="importPick"){ document.getElementById("importFile").click(); }
  else if(a==="importCancel"){ ui.importing=null; keepScroll(render); }
  else if(a==="importCards"||a==="importAll"){
    const imp=ui.importing; if(!imp) return;
    data.cards=data.cards.concat(imp.fresh);
    if(imp.learn){ const L=data.learn; Object.assign(L.exact, imp.learn.exact); imp.learn.titles.forEach(w=>{ if(!L.titles.includes(w)) L.titles.push(w); }); imp.learn.orgs.forEach(w=>{ if(!L.orgs.includes(w)) L.orgs.push(w); }); data.learn=cleanLearn(L); }
    if(a==="importAll"){ if(imp.profiles) data.profiles=imp.profiles; else if(imp.me) data.profiles.work=imp.me;
      if(imp.settings) data.settings=normalize({profiles:data.profiles,cards:[],settings:imp.settings}).settings; applySettings(); }
    ui.importing=null; save(); keepScroll(render); toast("已匯入 "+imp.fresh.length+" 張名片");
  }
  else if(a==="clearSamples"){ data.cards=data.cards.filter(c=>!c.sample); ui.openId=null; save(); keepScroll(render); toast("已移除範例名片"); }
  else if(a==="askReset"){ ui.confirmReset=true; keepScroll(render); }
  else if(a==="noReset"){ ui.confirmReset=false; keepScroll(render); }
  else if(a==="resetLook"){ data.settings=clone(DEFAULT_SETTINGS); ui.confirmReset=false; save(); applySettings(); keepScroll(render); toast("外觀已還原"); }
});

document.addEventListener("submit", e=>{
  e.preventDefault();
  if(e.target.id==="meForm"){
    data.profiles[data.active]=cleanMe({name:val("me-name"),title:val("me-title"),org:val("me-org"),tagline:val("me-tagline"),phone:val("me-phone"),email:val("me-email"),
      line:val("me-line"),web:val("me-web"),address:val("me-address"),intro:val("me-intro"),
      links:[0,1,2].map(i=>({label:val("me-ll"+i), url:val("me-lu"+i)}))});
    data.meta.tips.welcome=1;
    if(save()) toast("名片已更新"); ui.editing=false; render();
  } else if(e.target.id==="addForm"){
    const name=val("add-name");
    if(!name){ toast("至少要填姓名"); document.getElementById("add-name").focus(); return; }
    const fields={name,title:val("add-title"),org:val("add-org"),alt:val("add-alt"),phone:val("add-phone"),tel:val("add-tel"),fax:val("add-fax"),email:val("add-email"),line:val("add-line"),
      web:val("add-web"),address:val("add-address"),note:val("add-note"),ocrText:(ui.draft&&ui.draft.ocrText)||"",photo:ui.draftPhoto,photoBack:ui.draftBack};
    if(ui.editId){ finishAdd(fields,"edit"); return; }
    if(ui.newFor){ finishAdd(fields,"update",ui.newFor); return; }
    const same=findSame(fields);
    if(same){ syncDraft(); ui.same={id:same.card.id, why:same.why, fields}; keepScroll(render); document.querySelector('[data-act="sameUpdate"]')?.focus(); return; }
    finishAdd(fields,"new");
  }
});
document.addEventListener("keydown", e=>{
  // 自動長高的欄位：按 Enter 跳到下一格，不換行
  if(e.key==="Enter" && e.target.classList && e.target.classList.contains("grow") && !e.isComposing){
    e.preventDefault();
    const f=[...document.querySelectorAll("#addForm textarea.grow, #meForm textarea.grow")], i=f.indexOf(e.target);
    if(i>=0 && f[i+1]) f[i+1].focus(); else e.target.blur();
  }
});
document.addEventListener("input", e=>{
  if(e.target.classList && e.target.classList.contains("grow")){ e.target.style.height="auto"; e.target.style.height=e.target.scrollHeight+"px"; }
  if(e.target.id==="q"){ ui.query=e.target.value; rerenderCards(); }
  // 自動填入的欄位，使用者一改就拿掉「請確認」標記
  else if(e.target.classList && e.target.classList.contains("auto")){
    e.target.classList.remove("auto"); ui.auto && ui.auto.delete(e.target.id);
    const chk=e.target.closest("label")?.querySelector(".chk"); if(chk) chk.remove();
  }
});
document.addEventListener("change", async e=>{
  if(e.target.dataset && e.target.dataset.engine){
    data.settings.ocr.engine=e.target.dataset.engine; save({quiet:true}); keepScroll(render); document.getElementById("eng-"+data.settings.ocr.engine)?.focus();
  } else if(e.target.dataset && e.target.dataset.ocr){
    const k=e.target.dataset.ocr; data.settings.ocr[k]=e.target.checked;
    if(k!=="enabled" && ocr.worker){ ocr.worker.terminate().catch(()=>{}); ocr.worker=null; }   // 換語言要重新載入
    save({quiet:true}); keepScroll(render); document.getElementById("ocr-"+k)?.focus();
  } else if(e.target.dataset && e.target.dataset.show){
    const k=e.target.dataset.show; data.settings.show[k]=e.target.checked; save(); keepScroll(render); document.getElementById("show-"+k)?.focus();
  } else if(e.target.id==="importFile" && e.target.files[0]){
    const file=e.target.files[0]; e.target.value="";
    let d=null; try{ d=JSON.parse(await file.text()); }catch(err){}
    if(!prepareImport(d)){ toast("這個檔案不是名片夾的備份"); return; }
    keepScroll(render);
  } else if((e.target.id==="snapFile"||e.target.id==="pickFile") && e.target.files[0]){
    const file=e.target.files[0]; e.target.value="";
    const side=ui.snapSide==="back"?"back":"front";
    if(window.CardCrop){ syncDraft(); openCrop(side, file, false); return; }
    let img; try{ img=await compress(file); }catch(err){ toast("這張照片讀不出來，請再拍一次"); return; }
    usePhoto(side, img, file, false);
  }
});

/* ---------- 啟動：從 IndexedDB 讀資料（舊版 localStorage 會自動搬過來） ---------- */
(async function boot(){
  if(location.hash.startsWith("#c=")){
    const card=readEcard(location.hash);
    data=normalize(null); data.settings.cardColor=card?card.color:"green"; data.settings.fonts.name=card?card.font:"serif"; data.settings.fonts.cardText=card?card.textFont:"sans"; data.settings.show={phone:true,email:true,line:true,web:true,tagline:true};
    applySettings();
    if(card) renderEcardView(card);
    else { document.getElementById("tabs").hidden=true; document.getElementById("app").innerHTML='<div class="empty">這個名片連結不完整，請對方重新給你一次 QR code。</div>'; }
    return;
  }
  if(/[?&]openExternalBrowser=1/.test(location.search)) try{ history.replaceState(null,"",location.pathname+location.hash); }catch(e){}
  let raw=null;
  try{ raw=await idbGet("data"); }catch(e){}
  if(!raw){ try{ const ls=localStorage.getItem(STORE_KEY); if(ls){ raw=JSON.parse(ls); await idbSet("data", raw); } }catch(e){} }
  data=normalize(raw);
  if(!raw) data.meta.seenVersion=APP_VERSION;   // 第一次安裝：不用提示「有新功能」
  ui.editing=!data.profiles.work.name;   // 第一次打開：直接進入填寫自己的名片
  applySettings(); render(); initCloud();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} // 請瀏覽器不要自動清掉資料
})();
// 對方看電子名片時不安裝離線快取：不替別人的手機下載整個 app
if("serviceWorker" in navigator && !IS_ECARD){ addEventListener("load", ()=>navigator.serviceWorker.register("./sw.js?v="+encodeURIComponent(APP_VERSION)).catch(()=>{})); }
</script>
