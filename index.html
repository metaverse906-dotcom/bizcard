<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>隨身名片夾</title>
<meta name="description" content="自己用的數位名片與名片夾：QR code 交換名片，收到的名片疊成一盒，資料只存在你的手機裡。">
<meta name="theme-color" content="#E3EBE6" id="themeColor">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 每個字體分開載入：一個失敗不影響其他。中文字體依 unicode-range 分片，只下載用到的字。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Sung+HK:wght@500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+Hei+HK:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Layout: phone app on a soft sage ground, rounded white tiles; my card is the one dark object on the page,
   collected cards stack like a card box. --card and --f-card are set from settings by JS. */
:root{
  --card:#2F5F51;
  /* 四組字體由設定改寫：名字、名片內文、介面標題、介面內文 */
  --f-card:"Noto Serif TC","Songti TC",serif;
  --f-cardtext:"Noto Sans TC","PingFang TC",sans-serif;
  --f-head:"Noto Sans TC","PingFang TC",sans-serif;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  /* 介面色系跟著名片顏色走：JS 依設定改寫 --L-*（淺色）與 --D-*（深色），這裡是深綠的預設值 */
  --L-bg:#E3EBE6; --L-soft:#EEF3F0; --L-ink:#1F3530; --L-muted:#5B7069; --L-line:#C2D0C8; --L-link:#2F5F51; --L-stack1:#C7D6CD; --L-stack2:#D6E2DA;
  --D-bg:#131A18; --D-surface:#1D2725; --D-soft:#253230; --D-ink:#E4ECE8; --D-muted:#9DB0A9; --D-line:#33423E; --D-link:#8CC4B1; --D-stack1:#2A3835; --D-stack2:#33433F;
  --bg:var(--L-bg); --surface:#FFFFFF; --soft:var(--L-soft); --ink:var(--L-ink); --muted:var(--L-muted); --line:var(--L-line);
  --strong:var(--L-ink); --strong-ink:#FFFFFF; --link:var(--L-link); --danger:#A23E37;
  --sand:#F3E9D6; --sand-ink:#5A4318; --stack1:var(--L-stack1); --stack2:var(--L-stack2);
  --t0:#F3E9D6; --t0i:#3D3020; --t1:#DCE6F0; --t1i:#1F2E3D; --t2:#E6DFF0; --t2i:#2E2440; --t3:#D3E0D8; --t3i:#1F3530; --t4:#F2DEDB; --t4i:#45231F;
  --brass:#E8C98A;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:var(--D-bg); --surface:var(--D-surface); --soft:var(--D-soft); --ink:var(--D-ink); --muted:var(--D-muted); --line:var(--D-line);
  --strong:var(--D-ink); --strong-ink:var(--D-bg); --link:var(--D-link); --danger:#E7877E;
  --sand:#3A3122; --sand-ink:#EBD3A5; --stack1:var(--D-stack1); --stack2:var(--D-stack2);
  --t0:#3A3122; --t0i:#F0E2C6; --t1:#243241; --t1i:#D6E3F0; --t2:#30283D; --t2i:#E2D8F0; --t3:#22312B; --t3i:#D3E5DB; --t4:#3D2A28; --t4i:#F2D9D5;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:var(--D-bg); --surface:var(--D-surface); --soft:var(--D-soft); --ink:var(--D-ink); --muted:var(--D-muted); --line:var(--D-line);
  --strong:var(--D-ink); --strong-ink:var(--D-bg); --link:var(--D-link); --danger:#E7877E;
  --sand:#3A3122; --sand-ink:#EBD3A5; --stack1:var(--D-stack1); --stack2:var(--D-stack2);
  --t0:#3A3122; --t0i:#F0E2C6; --t1:#243241; --t1i:#D6E3F0; --t2:#30283D; --t2i:#E2D8F0; --t3:#22312B; --t3i:#D3E5DB; --t4:#3D2A28; --t4i:#F2D9D5;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6;font-variant-numeric:tabular-nums;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto;padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-head);font-size:1.65rem;font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em;line-height:1.3}
h2{font-size:.8rem;font-weight:500;color:var(--muted);letter-spacing:.12em;margin:0}
p{margin:0}
a{color:var(--link)}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:.9rem;color:var(--muted)}
.sub{color:var(--muted);font-size:.86rem}
button{font:inherit;cursor:pointer;color:inherit}
.pill{border:none;border-radius:999px;background:var(--surface);color:var(--ink);min-height:44px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.pill.strong{background:var(--strong);color:var(--strong-ink);font-weight:700}
.pill.big{min-height:56px;font-size:1.06rem;width:100%}
.pill.line{background:transparent;border:1px solid var(--line)}
.pill.danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
.pill:disabled{opacity:.5;cursor:not-allowed}
.round{width:52px;height:52px;border-radius:50%;border:none;background:var(--strong);color:var(--strong-ink);display:grid;place-items:center;flex:none}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tile{background:var(--surface);border-radius:22px;padding:16px}
svg.i{width:22px;height:22px;flex:none}

/* ---------- my card ---------- */
.stackwrap{position:relative;padding-top:26px}
.stackwrap::before,.stackwrap::after{content:"";position:absolute;height:60px;border-radius:16px}
.stackwrap::before{left:26px;right:26px;top:0;background:var(--stack1)}
.stackwrap::after{left:13px;right:13px;top:12px;background:var(--stack2)}
.bcard{position:relative;z-index:1;width:100%;max-width:100%;aspect-ratio:91/54;border-radius:16px;background:var(--card);container-type:inline-size;overflow:hidden;
  box-shadow:0 20px 34px -20px rgba(20,40,35,.75)}
.bcard::after{content:"";position:absolute;right:-12cqw;top:-12cqw;width:44cqw;height:44cqw;border-radius:50%;background:#FFFFFF;opacity:.07}
.bcard .in{position:absolute;inset:0;padding:6cqw 6.5cqw;display:flex;flex-direction:column;justify-content:space-between;color:#F4F1EA;font-family:var(--f-cardtext)}
.bcard .org{display:flex;justify-content:space-between;gap:3cqw;font-size:3.1cqw;letter-spacing:.1em;color:rgba(255,255,255,.72)}
.bcard .org i{font-style:normal;color:var(--brass)}
.bcard .nm{font-family:var(--f-card);font-weight:700;font-size:8.8cqw;line-height:1.2;letter-spacing:.1em}
.bcard .tt{font-size:3.6cqw;color:var(--brass);letter-spacing:.18em}
.bcard .tg{font-size:3.2cqw;color:rgba(255,255,255,.74);margin-top:1cqw}
.bcard .ct{font-size:3.1cqw;color:rgba(255,255,255,.88);border-top:1px solid rgba(232,201,138,.5);padding-top:2.2cqw;display:flex;flex-wrap:wrap;justify-content:space-between;gap:.4cqw 4cqw;min-width:0;overflow-wrap:anywhere}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qrtile{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrtile svg{width:100%;max-width:140px;height:auto;display:block;border-radius:6px}
.stackcol{display:flex;flex-direction:column;gap:12px}
.mini{flex:1;border:none;border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:12px;background:var(--surface);color:var(--ink);text-decoration:none;min-height:96px}
.mini.coffee{background:var(--sand);color:var(--sand-ink)}
.mini span{font-size:.92rem;font-weight:500}

form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=search],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 12px;width:100%}
input:focus,textarea:focus{border-color:var(--link);outline:none}
textarea{min-height:68px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

/* ---------- card box ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 18px;min-height:48px;color:var(--muted)}
.search input{flex:1;min-width:0;border:none;background:transparent;padding:0;border-radius:0}
.search input:focus{border:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--strong);color:var(--strong-ink);border-color:var(--strong)}
.box{display:flex;flex-direction:column;padding-top:4px}
.strip{all:unset;box-sizing:border-box;cursor:pointer;height:78px;margin-top:-14px;border-radius:16px 16px 0 0;padding:13px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  box-shadow:0 -6px 12px -8px rgba(20,40,35,.35)}
.strip:first-child{margin-top:0;box-shadow:none}
.strip:focus-visible{outline:2px solid var(--link);outline-offset:-3px}
.strip .o{display:block;font-size:.7rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .n{display:block;font-family:var(--f-card);font-size:1.13rem;font-weight:700;letter-spacing:.04em}
.strip .d{font-size:.76rem;opacity:.75;flex:none}
.strip>span:first-child{min-width:0}
.t0{background:var(--t0);color:var(--t0i)} .t1{background:var(--t1);color:var(--t1i)} .t2{background:var(--t2);color:var(--t2i)} .t3{background:var(--t3);color:var(--t3i)} .t4{background:var(--t4);color:var(--t4i)}
.open{margin-top:-14px;border-radius:16px;background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:12px;position:relative;
  box-shadow:0 -6px 14px -8px rgba(20,40,35,.4),0 18px 30px -22px rgba(20,40,35,.5)}
.box .open:first-child,.list .open{margin-top:0}
.open .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.open .top>div{min-width:0}
.open .o{font-size:.74rem;color:var(--muted)}
.open .n{font-family:var(--f-card);font-size:1.5rem;font-weight:700;letter-spacing:.04em;line-height:1.3}
.open .n small{font-family:var(--f-ui);font-size:.82rem;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
.badge{display:inline-block;font-family:var(--f-ui);font-size:.66rem;font-weight:500;border-radius:999px;padding:0 7px;background:var(--sand);color:var(--sand-ink);vertical-align:3px;margin-left:6px;letter-spacing:0}
.memo{font-size:.86rem;background:var(--soft);border-radius:12px;padding:10px 12px}
.kv{display:grid;grid-template-columns:3.6em 1fr;gap:4px 10px;margin:0;font-size:.9rem}
.kv dt{color:var(--muted);font-size:.8rem;padding-top:2px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:text}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.acts button,.acts a{min-height:44px;border-radius:12px;border:none;background:var(--soft);color:var(--ink);font-size:.84rem;display:grid;place-items:center;text-decoration:none}
.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.quick .mini{min-height:88px}
.photobtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.scanner{position:fixed;inset:0;z-index:25;background:#000000;color:#FFFFFF}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .frame{position:absolute;left:50%;top:44%;width:min(70vw,280px);aspect-ratio:1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.92);border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
.scanner .bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  padding:16px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.scanner .bar .pill{background:#FFFFFF;color:#1F3530;min-width:140px}
.importbox{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.photo{width:100%;border-radius:12px}
.del{display:flex;gap:8px;justify-content:flex-end}
.del button{min-height:36px;font-size:.8rem;padding:0 12px}
.textbtn{background:none;border:none;color:var(--muted);font-size:.8rem;text-decoration:underline;text-underline-offset:3px;min-height:36px;padding:0 4px}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:16px;padding:10px 14px;width:100%}
.lrow:focus-visible{outline:2px solid var(--link)}
.av{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-card);font-size:1.15rem;font-weight:700;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.lrow .who{min-width:0}
.lrow .who strong{display:block;font-weight:500}
.lrow .who span{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .d{font-size:.74rem;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 12px;background:var(--surface);border-radius:22px}
.photoin{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photoin img{width:96px;border-radius:10px}

/* ---------- settings ---------- */
.set{display:flex;flex-direction:column;gap:12px}
.choices{display:grid;gap:8px}
.choices.fonts{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.seg{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border-radius:16px;padding:12px 14px;background:var(--soft);display:flex;flex-direction:column;gap:2px;min-width:0;border:2px solid transparent}
.opt:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--strong)}
.opt .big{font-size:1.3rem;font-weight:700;line-height:1.35}
.opt .lbl{font-size:.76rem;color:var(--muted)}
.seg .opt,.two .opt{align-items:center;text-align:center;font-size:.9rem;min-height:48px;justify-content:center}
.swatches{display:flex;gap:14px;flex-wrap:wrap}
.sw{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{outline:2px solid var(--strong);outline-offset:3px}
.sw:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.frole{display:flex;flex-direction:column;gap:8px}
.frole+.frole{border-top:1px solid var(--line);padding-top:14px}
.frow{display:flex;gap:4px 10px;align-items:baseline;flex-wrap:wrap}
.flbl{font-weight:500;font-size:.95rem}
.fchips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid transparent;background:var(--soft);color:var(--ink);font-size:.95rem}
.fchip[aria-pressed="true"]{border-color:var(--strong);font-weight:700}
.check{flex-direction:row;align-items:center;gap:12px;color:var(--ink);font-size:.95rem;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--card);margin:0}
.preview-sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:10px 14px;margin-block:-10px 0}
.preview-sticky .bcard{max-width:340px;margin:0 auto;display:block}

/* ---------- bottom nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);display:flex;justify-content:center;gap:10px;
  padding:10px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
nav.tabs button{border:none;background:transparent;color:var(--muted);min-height:44px;min-width:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px}
nav.tabs button span{display:none;font-size:.9rem;font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);padding:0 18px}
nav.tabs button[aria-current="page"] span{display:inline}

/* ---------- give card ---------- */
.present{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.present .stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.present.flip .stage{transform:rotate(180deg)}
.pcard{width:min(100%,520px)}
.pqr{width:min(50vw,200px);background:#FFFFFF;border-radius:16px;padding:10px}
.pqr svg{width:100%;height:auto;display:block}
.pctrl{display:flex;gap:10px;justify-content:center;
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.pctrl .pill{flex:1;max-width:220px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--strong);color:var(--strong-ink);padding:9px 18px;border-radius:999px;font-size:.86rem;z-index:30;max-width:calc(100% - 40px)}
textarea.fallback{font-size:12px;min-height:120px}
@media (prefers-reduced-motion:no-preference){.open{animation:rise .22s ease-out}@keyframes rise{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:reduce){.present .stage{transition:none}}
</style>

</head>
<body>
<main id="app"></main>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="snapFile" accept="image/*" capture="environment" hidden>
<input type="file" id="pickFile" accept="image/*" hidden>
<nav class="tabs" aria-label="主選單">
  <button type="button" data-act="tab" data-tab="me" id="tab-me" aria-label="我的名片">
    <svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="12" rx="3"/><path d="M7 11h6M7 14h4"/></svg><span>我的名片</span></button>
  <button type="button" data-act="tab" data-tab="book" id="tab-book" aria-label="名片夾">
    <svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="3.5" width="14" height="17" rx="3"/><path d="M9 8h6M9 11.5h6M9 15h3"/></svg><span>名片夾</span></button>
  <button type="button" data-act="tab" data-tab="set" id="tab-set" aria-label="設定">
    <svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>設定</span></button>
</nav>
<div class="present" id="present" role="dialog" aria-modal="true" aria-label="遞名片" hidden></div>

<script>
// ===== 上線前要填的地方 =====
const TIP_URL = "";        // 打賞頁網址，例如 Buy Me a Coffee、Ko-fi、Portaly
const STORE_KEY = "bizcard.v1";

// ===== 個人化選項 =====
// 每種名片色配一套介面色：L = 淺色模式、D = 深色模式
const CARD_COLORS = {
  green:{name:"深綠", c:"#2F5F51",
    L:{bg:"#E3EBE6",soft:"#EEF3F0",ink:"#1F3530",muted:"#5B7069",line:"#C2D0C8",link:"#2F5F51",stack1:"#C7D6CD",stack2:"#D6E2DA"},

  brown:{name:"可可", c:"#5C4425",
    L:{bg:"#ECE6DC",soft:"#F4F0E9",ink:"#3A2C1C",muted:"#77695A",line:"#D6CCBC",link:"#5C4425",stack1:"#DACFBE",stack2:"#E5DCCD"},

    D:{bg:"#141516",surface:"#1E2022",soft:"#26292B",ink:"#E8EAEC",muted:"#A0A5AA",line:"#36393C",link:"#C9CED3",stack1:"#2B2E31",stack2:"#35383B"}}
};
const FONTS = {

  hei:   {name:"昭源黑體", stack:'"Chiron Hei HK","Noto Sans TC","PingFang TC",sans-serif'},
  serif: {name:"思源明體", stack:'"Noto Serif TC","Songti TC",serif'},

const FONT_ROLES = [
  {key:"name", label:"名字", hint:"名片和名片夾裡的姓名", cssVar:"--f-card"},
  {key:"cardText", label:"名片內文", hint:"單位、職稱、聯絡方式", cssVar:"--f-cardtext"},

const THEMES = {system:"跟隨系統", light:"淺色", dark:"深色"};
const VIEWS = {box:"卡盒", list:"清單"};
const SHOW_FIELDS = [["phone","電話"],["email","Email"],["line","LINE ID"],["web","網站"],["tagline","一句話介紹"]];
const DEFAULT_SETTINGS = {cardColor:"green", fonts:{name:"serif",cardText:"sans",head:"sans",body:"sans"}, theme:"system", bookView:"box", presentFlip:true,
  show:{phone:true,email:true,line:true,web:true,tagline:true}};

const DEFAULT = {
  me:{name:"",title:"",org:"",tagline:"",phone:"",email:"",line:"",web:""},
  cards:[
    {id:"s1",sample:true,name:"陳志明",title:"產品經理",org:"範例科技股份有限公司",phone:"0912-000-000",email:"chen@example.com",line:"chenpm",note:"開發者聚會認識",added:"2026-09-18",photo:""},
    {id:"s2",sample:true,name:"林怡君",title:"社工督導",org:"士林區家庭服務中心",phone:"02-2800-0000",email:"lin@example.org",line:"",note:"跨網絡個案會議認識",added:"2026-10-02",photo:""},
    {id:"s3",sample:true,name:"李佩珊",title:"個管師",org:"範例健康服務中心",phone:"02-2890-0000",email:"lee@example.org",line:"",note:"轉介聯繫會議認識，負責長照個案",added:"2026-10-11",photo:""}
  ],
  settings:DEFAULT_SETTINGS
};
const clone = o => JSON.parse(JSON.stringify(o));
let data = null;   // 由 boot() 從 IndexedDB 載入
const ui = {tab:"me", editing:false, adding:false, draftPhoto:"", query:"", sort:"recent", photoOnly:false,
  openId:null, confirmId:null, showPhoto:false, confirmReset:false, lock:null, importing:null};
const hostTheme = null;

/* ---------- 儲存：IndexedDB，容量比 localStorage 大很多，照片放得下 ---------- */
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{ const r=indexedDB.open("bizcard",1);
    r.onupgradeneeded=()=>r.result.createObjectStore("kv");
    r.onsuccess=()=>{ _db=r.result; res(_db); }; r.onerror=()=>rej(r.error); });
}
async function idbGet(k){ const db=await idb(); return new Promise((res,rej)=>{ const q=db.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbSet(k,v){ const db=await idb(); return new Promise((res,rej)=>{ const tx=db.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=tx.onabort=()=>rej(tx.error); }); }

const str = v => typeof v==="string" ? v.slice(0,500) : "";
const PHOTO_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function cleanCard(c){   // 匯入的檔案不可信：只留已知欄位、只接受圖片格式的照片
  return {id:str(c.id).replace(/[^\w-]/g,"").slice(0,40)||("c"+Math.random().toString(36).slice(2)), sample:!!c.sample,
    name:str(c.name), title:str(c.title), org:str(c.org), phone:str(c.phone), email:str(c.email), line:str(c.line),
    note:str(c.note), added:/^\d{4}-\d{2}-\d{2}$/.test(c.added)?c.added:today(), photo:(typeof c.photo==="string"&&PHOTO_RE.test(c.photo))?c.photo:""};
}
function cleanMe(m){ const o={}; ["name","title","org","tagline","phone","email","line","web"].forEach(k=>o[k]=str(m&&m[k])); return o; }

function normalize(d){
  if(!d || !d.me || !Array.isArray(d.cards)) d=clone(DEFAULT);
  d={me:cleanMe(d.me), cards:d.cards.filter(c=>c&&typeof c==="object").map(cleanCard), settings:d.settings};
  const s=Object.assign(clone(DEFAULT_SETTINGS), d.settings||{});
  s.show=Object.assign(clone(DEFAULT_SETTINGS.show), (d.settings&&d.settings.show)||{});
  if(!CARD_COLORS[s.cardColor]) s.cardColor=DEFAULT_SETTINGS.cardColor;   // 舊版設定遷移
  s.fonts=Object.assign(clone(DEFAULT_SETTINGS.fonts), (d.settings&&d.settings.fonts)||{});
  if(d.settings && d.settings.cardFont && !d.settings.fonts && FONTS[d.settings.cardFont]) s.fonts.name=d.settings.cardFont; // 舊版只有名字字體
  Object.keys(s.fonts).forEach(k=>{ if(!FONTS[s.fonts[k]]) s.fonts[k]=DEFAULT_SETTINGS.fonts[k]; });
  delete s.cardFont;
  if(!VIEWS[s.bookView]) s.bookView="box";
  d.settings=s; return d;
}
function save(){
  idbSet("data", data).catch(()=>toast("沒存進去：手機空間不足或瀏覽器不允許儲存。"));
  return true;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const vesc = s => String(s ?? "").replace(/\\/g,"\\\\").replace(/[,;]/g, m => "\\"+m).replace(/\n/g,"\\n");
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const short = d => (d||"").slice(5);
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 2600); }
function greeting(){ const h=new Date().getHours(); return h<5?"夜深了":h<11?"早安":h<14?"午安":h<18?"午後好":"晚安"; }
function tint(id){ let n=0; for(const ch of String(id)) n+=ch.charCodeAt(0); return "t"+(n%5); }

function applySettings(){
  const s=data.settings, r=document.documentElement;
  const pal=CARD_COLORS[s.cardColor];
  r.style.setProperty("--card", pal.c);
  Object.entries(pal.L).forEach(([k,v])=>r.style.setProperty("--L-"+k, v));
  Object.entries(pal.D).forEach(([k,v])=>r.style.setProperty("--D-"+k, v));
  FONT_ROLES.forEach(role=>r.style.setProperty(role.cssVar, FONTS[s.fonts[role.key]].stack));
  if(s.theme==="system"){ hostTheme ? r.setAttribute("data-theme",hostTheme) : r.removeAttribute("data-theme"); }
  else r.setAttribute("data-theme", s.theme);
  // 手機狀態列的顏色跟著底色
  const dark = s.theme==="dark" || (s.theme==="system" && matchMedia("(prefers-color-scheme: dark)").matches);
  const meta=document.getElementById("themeColor"); if(meta) meta.content = dark ? pal.D.bg : pal.L.bg;
}
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>{ if(data) applySettings(); });
function visible(m){ const s=data.settings.show, o={...m}; SHOW_FIELDS.forEach(([k])=>{ if(!s[k]) o[k]=""; }); return o; }

function vcard(m){
  const L=["BEGIN:VCARD","VERSION:3.0","N:;"+vesc(m.name)+";;;","FN:"+vesc(m.name)];
  if(m.org) L.push("ORG:"+vesc(m.org));
  if(m.title) L.push("TITLE:"+vesc(m.title));
  if(m.phone) L.push("TEL;TYPE=CELL:"+m.phone.replace(/[^\d+]/g,""));
  if(m.email) L.push("EMAIL:"+vesc(m.email));
  if(m.web) L.push("URL:"+vesc(m.web));
  const note=[m.line&&("LINE: "+m.line), m.note].filter(Boolean).join(" / ");
  if(note) L.push("NOTE:"+vesc(note));
  L.push("END:VCARD"); return L.join("\r\n");
}
function plainText(m){
  return [m.name+(m.title?"｜"+m.title:""), m.org, m.tagline, m.phone&&("電話 "+m.phone), m.email&&("Email "+m.email), m.line&&("LINE "+m.line), m.web].filter(Boolean).join("\n");
}
function qrSvg(text){
  if(!window.qrcode) return '<p class="sub">QR code 元件沒有載入，請重新整理頁面。</p>';
  try{
    if(qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs["UTF-8"]) qrcode.stringToBytes=qrcode.stringToBytesFuncs["UTF-8"];
    const q=qrcode(0,"M"); q.addData(text,"Byte"); q.make();
    const n=q.getModuleCount(); let d="";
    for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d+="M"+c+" "+r+"h1v1h-1z";
    return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" role="img" aria-label="名片 QR code" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#FFFFFF"/><path d="'+d+'" fill="#1F3530"/></svg>';
  }catch(e){ return '<p class="sub">資料太長，QR code 放不下。請縮短網站或介紹。</p>'; }
}
function cardHTML(m){
  m=visible(m);
  const ct=[m.phone, m.email, m.line&&("LINE "+m.line), m.web].filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join("");
  return '<div class="bcard"><div class="in"><div class="org"><span>'+esc(m.org)+'</span><i>●</i></div>'
    +'<div><div class="nm">'+esc(m.name||"（未填姓名）")+'</div><div class="tt">'+esc(m.title)+'</div>'+(m.tagline?'<div class="tg">'+esc(m.tagline)+'</div>':'')+'</div>'
    +'<div class="ct">'+ct+'</div></div></div>';
}
function field(id,label,val,type="text",ph=""){
  return '<label for="'+id+'">'+label+'<input id="'+id+'" name="'+id+'" type="'+type+'" value="'+esc(val)+'" placeholder="'+esc(ph)+'" autocomplete="off"></label>';
}
const ICON = {
  copy:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  cup:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 9h11v5a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16"/></svg>',
  plus:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',
  cam:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  qr:'<svg class="i" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 20h2M20 14v2"/></svg>',
  search:'<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>'
};

/* ---------- 我的名片 ---------- */
function renderMe(){
  const m=data.me;
  const editor = ui.editing ? '<section class="tile"><form id="meForm"><h2>編輯名片內容</h2>'
    + field("me-name","姓名",m.name) + '<div class="grid2">'+field("me-title","職稱",m.title)+field("me-org","單位",m.org)+'</div>'
    + field("me-tagline","一句話介紹（選填）",m.tagline,"text","例如：陪你把卡住的事慢慢說清楚")
    + '<div class="grid2">'+field("me-phone","電話",m.phone,"tel")+field("me-email","Email",m.email,"email")+'</div>'
    + '<div class="grid2">'+field("me-line","LINE ID",m.line)+field("me-web","網站",m.web,"url","https://")+'</div>'
    + '<div class="row"><button class="pill strong" type="submit">儲存名片</button><button type="button" class="pill line" data-act="cancelEdit">取消</button></div></form></section>' : "";
  const tip = TIP_URL
    ? '<a class="mini coffee" href="'+esc(TIP_URL)+'" target="_blank" rel="noopener">'+ICON.cup+'<span>請我喝咖啡</span></a>'
    : '<button type="button" class="mini coffee" data-act="noTip">'+ICON.cup+'<span>請我喝咖啡</span></button>';
  return '<div class="head"><div><div class="eyebrow">'+greeting()+(m.name?'，'+esc(m.name):'')+'</div><h1>'+(m.name?'今天要遞名片嗎？':'先填上你的名片')+'</h1></div>'
    + (ui.editing?'':'<button type="button" class="pill" data-act="edit">編輯</button>')+'</div>'
    + '<div class="stackwrap">'+cardHTML(m)+'</div>'
    + editor
    + (ui.editing?'':'<button type="button" class="pill strong big" data-act="present">遞名片給對方</button>')
    + '<div class="tiles"><div class="tile qrtile">'+qrSvg(vcard(visible(m)))+'<span class="sub">相機掃描就能存聯絡人</span></div>'
    + '<div class="stackcol"><button type="button" class="mini" data-act="copyMe">'+ICON.copy+'<span>複製文字版</span></button>'+tip+'</div></div>'
    + '<p class="sub" style="text-align:center">名片和 QR code 只包含設定裡打開的欄位，不經過任何伺服器。</p>';
}

/* ---------- 名片夾 ---------- */
function filtered(){
  const q=ui.query.trim().toLowerCase();
  let list=data.cards.filter(c=>!ui.photoOnly || c.photo);
  if(q) list=list.filter(c=>[c.name,c.org,c.title,c.note,c.phone,c.email,c.line].join(" ").toLowerCase().includes(q));
  if(ui.sort==="org") list.sort((a,b)=>(a.org||"").localeCompare(b.org||"","zh-Hant")||(a.name||"").localeCompare(b.name||"","zh-Hant"));
  else list.sort((a,b)=>(a.added||"").localeCompare(b.added||"")); // 舊的在上，最新的在最下面展開
  return list;
}
function openHTML(c){
  const kv=[["電話",c.phone],["Email",c.email],["LINE",c.line]].filter(x=>x[1]).map(([k,v])=>'<dt>'+k+'</dt><dd>'+esc(v)+'</dd>').join("");
  const acts=[c.phone&&'<a href="tel:'+esc(c.phone.replace(/[^\d+]/g,""))+'">撥電話</a>',
    c.email&&'<button type="button" data-act="copy" data-text="'+esc(c.email)+'">複製 Email</button>',
    c.photo&&'<button type="button" data-act="photo">'+(ui.showPhoto?"收起照片":"看照片")+'</button>'].filter(Boolean).join("");
  return '<div class="open"><div class="top"><div><div class="o">'+esc(c.org)+'</div><div class="n">'+esc(c.name)+'<small>'+esc(c.title)+'</small>'+(c.sample?'<span class="badge">範例</span>':'')+'</div></div><span class="sub">'+short(c.added)+'</span></div>'
    + (kv?'<dl class="kv">'+kv+'</dl>':'')
    + (c.note?'<div class="memo">'+esc(c.note)+'</div>':'')
    + (ui.showPhoto&&c.photo?'<img class="photo" src="'+c.photo+'" alt="'+esc(c.name)+' 的名片照片">':'')
    + (acts?'<div class="acts">'+acts+'</div>':'')
    + '<div class="del">'+(ui.confirmId===c.id
        ? '<button type="button" class="pill danger" data-act="del" data-id="'+c.id+'">確定刪除</button><button type="button" class="pill line" data-act="noDel">保留</button>'
        : '<button type="button" class="textbtn" data-act="askDel" data-id="'+c.id+'">刪除這張</button>')+'</div></div>';
}
function renderCards(){
  const list=filtered();
  if(!list.length) return '<div class="empty">'+(data.cards.length?"找不到符合的名片。":"名片夾是空的。按右上角的 ＋ 存下第一張。")+'</div>';
  if(data.settings.bookView==="list"){
    return '<div class="list">'+list.slice().reverse().map(c=>{
      if(ui.openId===c.id) return openHTML(c);
      const t=tint(c.id);
      return '<button type="button" class="lrow" data-act="pick" data-id="'+c.id+'"><span class="av '+t+'">'+(c.photo?'<img src="'+c.photo+'" alt="">':esc((c.name||"?").slice(0,1)))+'</span><span class="who"><strong>'+esc(c.name)+(c.sample?'<span class="badge">範例</span>':'')+'</strong><span>'+esc([c.org,c.title].filter(Boolean).join("・"))+'</span></span><span class="d">'+short(c.added)+'</span></button>';
    }).join("")+'</div>';
  }
  const sel = list.find(c=>c.id===ui.openId) || list[list.length-1];
  const strips = list.filter(c=>c!==sel).map(c=>'<button type="button" class="strip '+tint(c.id)+'" data-act="pick" data-id="'+c.id+'"><span><span class="o">'+esc(c.org||" ")+'</span><span class="n">'+esc(c.name)+'</span></span><span class="d">'+short(c.added)+'</span></button>').join("");
  return '<div class="box">'+strips+openHTML(sel)+'</div>';
}
function renderBook(){
  const n=data.cards.length, samples=data.cards.filter(c=>c.sample).length;
  const d=ui.draft||{};
  const add = ui.adding ? '<section class="tile"><form id="addForm"><h2>新增名片</h2>'
    + '<div class="photoin">'+(ui.draftPhoto?'<img src="'+ui.draftPhoto+'" alt="名片照片預覽">':'')
    + '<div style="display:flex;flex-direction:column;gap:8px;flex:1 1 180px;min-width:0"><span class="sub">名片照片（選填）。縮小後存在 app 裡，不會留在相簿。</span><div class="photobtns">'

async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast("已複製"); }
  catch(e){
    const box=document.getElementById("fb")||document.getElementById("app");
    const ta=document.createElement("textarea"); ta.className="fallback"; ta.value=text; ta.readOnly=true;
    box.appendChild(ta); ta.focus(); ta.select(); toast("無法自動複製，已選取文字，請手動複製");
  }
}
function compress(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const s=Math.min(1,900/Math.max(img.width,img.height));
        const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.7)); };
      img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

// 交出檔案：手機上跳出分享選單（可以直接存到 Google Drive），不支援的瀏覽器就直接下載
async function deliver(filename, text, mime){
  const blob=new Blob([text],{type:mime});
  try{
    const file=new File([blob], filename, {type:mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast("已下載 "+filename);
}

const CAN_SCAN = ("BarcodeDetector" in window) && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
const scan={stream:null, timer:null};
async function startScan(){
  let det;
  try{ det=new BarcodeDetector({formats:["qr_code"]}); }catch(e){ toast("這個瀏覽器不支援掃描 QR code"); return; }
  try{ scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}); }
  catch(e){ toast(e && e.name==="NotAllowedError" ? "相機權限被拒絕了。請到 Chrome 的網站設定，允許這個網站使用相機。" : "打不開相機，請再試一次"); return; }
  const v=document.getElementById("scanVideo");
  v.srcObject=scan.stream; document.getElementById("scanner").hidden=false; document.body.style.overflow="hidden";
  try{ await v.play(); }catch(e){}
  const tick=async()=>{
    if(!scan.stream) return;
    try{ const r=await det.detect(v); if(r && r.length && r[0].rawValue){ const raw=r[0].rawValue; stopScan(); onScanned(raw); return; } }catch(e){}
    scan.timer=setTimeout(tick, 250);
  };
  tick();
}
function stopScan(){
  clearTimeout(scan.timer);
  if(scan.stream){ scan.stream.getTracks().forEach(t=>t.stop()); scan.stream=null; }
  document.getElementById("scanVideo").srcObject=null;
  document.getElementById("scanner").hidden=true; document.body.style.overflow="";
}

// 讀懂 QR code 裡的名片：vCard（大多數數位名片）與 MECARD（部分手機產生的格式）
function parseContact(raw){
  const t=String(raw).trim(), o={};
  const un=s=>s.replace(/\\n/gi,"\n").replace(/\\([,;:\\])/g,"$1").trim();
  const joinName=(fam,giv)=>{ fam=(fam||"").trim(); giv=(giv||"").trim(); return /^[\x00-\x7F]*$/.test(fam+giv) ? [giv,fam].filter(Boolean).join(" ") : fam+giv; };
  if(/^BEGIN:VCARD/i.test(t)){
    const lines=t.replace(/\r?\n[ \t]/g,"").split(/\r?\n/);
    for(const ln of lines){
      const i=ln.indexOf(":"); if(i<0) continue;
      const key=ln.slice(0,i).split(";")[0].replace(/^item\d+\./i,"").toUpperCase(), v=ln.slice(i+1);
      if(key==="FN") o.name=un(v);
      else if(key==="N" && !o.name){ const p=v.split(";"); o.name=joinName(un(p[0]||""),un(p[1]||"")); }
      else if(key==="ORG") o.org=un(v.split(";")[0]);
      else if(key==="TITLE") o.title=un(v);
      else if(key==="TEL" && !o.phone) o.phone=un(v);
      else if(key==="EMAIL" && !o.email) o.email=un(v);
      else if(key==="URL" && !o.web) o.web=un(v);
      else if(key==="NOTE") o.noteRaw=un(v);
    }
  } else if(/^MECARD:/i.test(t)){
    t.slice(7).split(/(?<!\\);/).forEach(part=>{
      const i=part.indexOf(":"); if(i<0) return;
      const k=part.slice(0,i).toUpperCase(), v=un(part.slice(i+1));
      if(k==="N"){ const p=v.split(","); o.name=joinName(p[0],p[1]); }
      else if(k==="TEL" && !o.phone) o.phone=v;
      else if(k==="EMAIL" && !o.email) o.email=v;
      else if(k==="ORG") o.org=v;
      else if(k==="URL") o.web=v;
      else if(k==="NOTE") o.noteRaw=v;
    });
  } else return null;
  if(o.noteRaw){
    const m=o.noteRaw.match(/LINE[:：]\s*([^\s\/]+)/i); if(m) o.line=m[1];
    const rest=o.noteRaw.replace(/LINE[:：]\s*[^\s\/]+\s*\/?\s*/i,"").trim(); if(rest) o.note=rest;
    delete o.noteRaw;
  }
  if(o.web){ o.note=[o.note,o.web].filter(Boolean).join("\n"); delete o.web; }
  Object.keys(o).forEach(k=>o[k]=str(o[k]));
  return o;
}
function onScanned(raw){
  const c=parseContact(raw);
  if(c && c.name){ ui.draft=c; toast("讀到「"+c.name+"」的名片，確認後按存入"); }
  else { ui.draft={note:str(raw)}; toast("這不是名片格式的 QR code，內容先放在備註裡"); }
  ui.tab="book"; ui.adding=true; ui.draftPhoto=""; render(); window.scrollTo(0,0);
}

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, id=el.dataset.id;
  if(a==="tab"){ ui.tab=el.dataset.tab; ui.editing=false; ui.confirmReset=false; render(); window.scrollTo(0,0); }
  else if(a==="edit"){ ui.editing=true; render(); document.getElementById("me-name")?.focus(); }
  else if(a==="cancelEdit"){ ui.editing=false; render(); }
  else if(a==="present"){ openPresent(); }
  else if(a==="closePresent"){ closePresent(); }
  else if(a==="flip"){ data.settings.presentFlip=!data.settings.presentFlip; save(); document.getElementById("present").classList.toggle("flip", data.settings.presentFlip); el.textContent=flipLabel(); }
  else if(a==="copyMe"){ copy(plainText(visible(data.me))); }
  else if(a==="noTip"){ toast("打賞連結還沒設定，部署時再接上"); }
  else if(a==="copy"){ copy(el.dataset.text); }
  else if(a==="add"){ ui.adding=true; ui.draft={}; ui.draftPhoto=""; render(); document.getElementById("add-name")?.focus(); }
  else if(a==="cancelAdd"){ ui.adding=false; ui.draft=null; ui.draftPhoto=""; render(); }
  else if(a==="snap"){ syncDraft(); document.getElementById("snapFile").click(); }
  else if(a==="pickPhoto"){ syncDraft(); document.getElementById("pickFile").click(); }
  else if(a==="clearPhoto"){ syncDraft(); ui.draftPhoto=""; keepScroll(render); }
  else if(a==="scan"){ startScan(); }
  else if(a==="scanStop"){ stopScan(); }
  else if(a==="pick"){ ui.openId = (data.settings.bookView==="list" && ui.openId===id) ? null : id; ui.confirmId=null; ui.showPhoto=false; rerenderCards(); }
  else if(a==="photo"){ ui.showPhoto=!ui.showPhoto; rerenderCards(); }
  else if(a==="sort"){ ui.sort=el.dataset.key; keepScroll(render); }
  else if(a==="photoOnly"){ ui.photoOnly=!ui.photoOnly; keepScroll(render); }
  else if(a==="askDel"){ ui.confirmId=id; rerenderCards(); }
  else if(a==="noDel"){ ui.confirmId=null; rerenderCards(); }
  else if(a==="del"){ data.cards=data.cards.filter(c=>c.id!==id); ui.openId=null; ui.confirmId=null; save(); keepScroll(render); toast("已刪除"); }
  else if(a==="set"){ data.settings[el.dataset.group]=el.dataset.key; save(); applySettings(); keepScroll(render); }
  else if(a==="font"){ data.settings.fonts[el.dataset.role]=el.dataset.key; save(); applySettings(); keepScroll(render); }
  else if(a==="exportJson"){
    const payload={app:"bizcard",version:1,exported:new Date().toISOString(),me:data.me,settings:data.settings,cards:data.cards.filter(c=>!c.sample)};
    deliver("名片夾備份-"+today()+".json", JSON.stringify(payload), "application/json");
  }
  else if(a==="exportVcf"){
    const real=data.cards.filter(c=>!c.sample);
    if(!real.length){ toast("名片夾裡還沒有自己存的名片"); return; }
    deliver("名片夾聯絡人-"+today()+".vcf", real.map(vcard).join("\r\n")+"\r\n", "text/vcard");
  }
  else if(a==="importPick"){ document.getElementById("importFile").click(); }
  else if(a==="importCancel"){ ui.importing=null; keepScroll(render); }
  else if(a==="importCards"||a==="importAll"){
    const imp=ui.importing; if(!imp) return;
    data.cards=data.cards.concat(imp.fresh);
    if(a==="importAll"){ data.me=imp.me; if(imp.settings) data.settings=normalize({me:data.me,cards:[],settings:imp.settings}).settings; applySettings(); }
    ui.importing=null; save(); keepScroll(render); toast("已匯入 "+imp.fresh.length+" 張名片");
  }
  else if(a==="clearSamples"){ data.cards=data.cards.filter(c=>!c.sample); ui.openId=null; save(); keepScroll(render); toast("已移除範例名片"); }
  else if(a==="askReset"){ ui.confirmReset=true; keepScroll(render); }
  else if(a==="noReset"){ ui.confirmReset=false; keepScroll(render); }
  else if(a==="resetLook"){ data.settings=clone(DEFAULT_SETTINGS); ui.confirmReset=false; save(); applySettings(); keepScroll(render); toast("外觀已還原"); }
});

});

/* ---------- 啟動：從 IndexedDB 讀資料（舊版 localStorage 會自動搬過來） ---------- */
(async function boot(){
  let raw=null;
  try{ raw=await idbGet("data"); }catch(e){}
  if(!raw){ try{ const ls=localStorage.getItem(STORE_KEY); if(ls){ raw=JSON.parse(ls); await idbSet("data", raw); } }catch(e){} }
  data=normalize(raw);
  ui.editing=!data.me.name;   // 第一次打開：直接進入填寫自己的名片
  applySettings(); render();
  try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} // 請瀏覽器不要自動清掉資料
})();
if("serviceWorker" in navigator){ addEventListener("load", ()=>navigator.serviceWorker.register("./sw.js").catch(()=>{})); }
</script>
